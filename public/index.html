<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silsila-e-Zahidiya Mysore</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f3d2e; color: #fff; min-height: 100vh; }
  .container { max-width: 480px; margin: 0 auto; padding: 16px; }
  .card { background: #14503b; border-radius: 14px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  h1, h2, h3 { margin-bottom: 10px; }
  h1 { text-align: center; font-size: 22px; color: #ffd700; }
  input, select, button, textarea {
    width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: none; font-size: 15px;
  }
  button { background: #ffd700; color: #0f3d2e; font-weight: bold; cursor: pointer; transition: 0.2s; }
  button:hover { opacity: 0.85; }
  button.secondary { background: #1c6b4f; color: #fff; }
  .hidden { display: none !important; }
  .tab-bar { display: flex; justify-content: space-around; background: #14503b; padding: 10px 0; position: fixed; bottom: 0; left: 0; right: 0; }
  .tab-bar button { width: auto; padding: 8px 14px; background: transparent; color: #fff; font-size: 13px; }
  .tab-bar button.active { color: #ffd700; }
  .list-item { background: #1c6b4f; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .badge { background: #ffd700; color: #0f3d2e; border-radius: 20px; padding: 2px 10px; font-size: 12px; font-weight: bold; }
  .row { display: flex; gap: 8px; align-items: center; }
  .stat-box { flex: 1; background: #1c6b4f; border-radius: 10px; padding: 14px; text-align: center; }
  .stat-box .num { font-size: 24px; font-weight: bold; color: #ffd700; }
  #notifBadge { background: red; border-radius: 50%; padding: 2px 7px; font-size: 11px; margin-left: 6px; }
  .content-area { padding-bottom: 70px; }
  a { color: #ffd700; }
</style>
</head>
<body>

<div class="container content-area" id="app">

  <!-- ============ LOGIN SCREEN ============ -->
  <div id="loginScreen">
    <h1>🕌 Silsila-e-Zahidiya Mysore</h1>
    <div class="card">
      <h3 id="loginTitle">Login</h3>
      <div id="loginFields">
        <input type="text" id="loginMobile" placeholder="Mobile Number">
        <input type="password" id="loginPassword" placeholder="Password">
      </div>
      <div id="registerFields" class="hidden">
        <input type="text" id="regName" placeholder="Full Name">
        <input type="text" id="regMobile" placeholder="Mobile Number">
        <input type="password" id="regPassword" placeholder="Password">
        <select id="regGroup">
          <option value="mardana">Mardana</option>
          <option value="zanana">Zanana</option>
        </select>
      </div>
      <button onclick="handleLoginOrRegister()" id="loginActionBtn">Login</button>
      <button class="secondary" onclick="toggleLoginRegister()" id="toggleBtn">New user? Register here</button>
      <p id="loginMsg" style="margin-top:8px; font-size:13px; color:#ffd700;"></p>
    </div>
  </div>

  <!-- ============ MAIN APP (after login) ============ -->
  <div id="mainApp" class="hidden">

    <div class="row" style="justify-content:space-between; margin-bottom:10px;">
      <h1 style="font-size:18px;">🕌 Zahidiya Mysore</h1>
      <div class="row" style="width:auto;">
        <button class="secondary" style="width:auto;" onclick="showScreen('notifications')">🔔<span id="notifBadge" class="hidden">0</span></button>
        <button class="secondary" style="width:auto;" onclick="logout()">Logout</button>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="card">
      <div class="row">
        <input type="text" id="searchBox" placeholder="Search classes..." oninput="filterClasses()">
        <button style="width:auto;" onclick="startVoiceSearch()">🎤</button>
      </div>
    </div>
    <!-- Namaz Times -->
    <div class="card">
      <h3>🕋 Namaz Timings</h3>
      <div id="prayerTimes"></div>
      <div class="row" style="margin-top:8px;">
        <span style="font-size:13px;">Alarm</span>
        <input type="checkbox" id="alarmToggle" style="width:auto;" onchange="toggleAlarm()">
      </div>
    </div>

    <!-- Classes List -->
    <div class="card">
      <h3>📚 Classes</h3>
      <div id="classList"></div>
    </div>

    <!-- ============ NOTIFICATIONS SCREEN ============ -->
    <div id="notificationsScreen" class="hidden">
      <div class="card">
        <div class="row" style="justify-content:space-between;">
          <h3>🔔 Notifications</h3>
          <button class="secondary" style="width:auto;" onclick="showScreen('home')">← Back</button>
        </div>
        <div id="notifList"></div>
      </div>
    </div>

    <!-- ============ ADMIN PANEL ============ -->
    <div id="adminScreen" class="hidden">
      <div class="card">
        <h3>📊 Mureed Stats</h3>
        <div class="row">
          <div class="stat-box"><div class="num" id="totalCount">0</div><div>Total</div></div>
          <div class="stat-box"><div class="num" id="mardanaCount">0</div><div>Mardana</div></div>
          <div class="stat-box"><div class="num" id="zananaCount">0</div><div>Zanana</div></div>
        </div>
      </div>

      <div class="card">
        <h3>⏳ Pending Approvals</h3>
        <div id="pendingList"></div>
      </div>

      <div class="card">
        <h3>➕ Direct Add Mureed</h3>
        <input type="text" id="daName" placeholder="Full Name">
        <input type="text" id="daMobile" placeholder="Mobile Number">
        <input type="password" id="daPassword" placeholder="Password">
        <select id="daGroup">
          <option value="mardana">Mardana</option>
          <option value="zanana">Zanana</option>
        </select>
        <button onclick="directAddMureed()">Add Mureed</button>
      </div>

      <div class="card">
        <h3>📥 Bulk Add Mureeds</h3>
        <p style="font-size:12px; color:#ffd700; margin-bottom:6px;">Format: Name,Mobile,Password,Group (one per line)</p>
        <textarea id="bulkData" rows="5" placeholder="Ali Khan,9876543210,pass123,mardana"></textarea>
        <button onclick="bulkAddMureeds()">Bulk Add</button>
      </div>

      <div class="card">
        <h3>📤 Upload New Class</h3>
        <input type="text" id="classTitle" placeholder="Class Title">
        <select id="classType">
          <option value="audio">Audio (MP3)</option>
          <option value="video">Video</option>
          <option value="pdf">PDF</option>
        </select>
        <input type="text" id="classUrl" placeholder="File URL (link)">
        <select id="classGroup">
          <option value="both">Both</option>
          <option value="mardana">Mardana</option>
          <option value="zanana">Zanana</option>
        </select>
        <button onclick="uploadClass()">Upload Class</button>
      </div>
    </div>

  </div>
</div>

<!-- ============ BOTTOM TAB BAR ============ -->
<div class="tab-bar hidden" id="tabBar">
  <button onclick="showScreen('home')" id="tabHome" class="active">🏠 Home</button>
  <button onclick="showScreen('admin')" id="tabAdmin" class="hidden">⚙️ Admin</button>
</div>
