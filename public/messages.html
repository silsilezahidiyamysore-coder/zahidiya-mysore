<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namaz Messages — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" as="style">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f5f0;
    color: #1a1a1a;
    padding: 16px;
    line-height: 1.5;
  }
  .nastaliq {
    font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif !important;
    direction: rtl;
    unicode-bidi: embed;
    line-height: 2.2;
  }
  .header {
    background: #1b5e20;
    color: white;
    padding: 14px;
    border-radius: 12px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header h1.nastaliq { font-size: 20px; line-height: 2.4; }
  .lang-toggle { display: flex; gap: 8px; }
  .lang-btn {
    padding: 6px 14px;
    border: 2px solid white;
    background: transparent;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
  }
  .lang-btn.active { background: white; color: #1b5e20; }
  .lang-btn.nastaliq {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 14px;
    line-height: 2;
    padding: 4px 18px;
    direction: rtl;
    unicode-bidi: embed;
  }
  .top-nav { text-align: center; margin-bottom: 14px; }
  .top-nav a {
    color: #1b5e20;
    text-decoration: none;
    font-weight: bold;
    padding: 8px 18px;
    border: 2px solid #1b5e20;
    border-radius: 8px;
    display: inline-block;
    background: white;
    font-size: 13px;
  }
  .top-nav a:hover { background: #e8f5e9; }
  .card {
    background: white;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    border-left: 4px solid #1b5e20;
  }
  .prayer-title {
    font-size: 15px;
    font-weight: 700;
    color: #1b5e20;
    margin-bottom: 10px;
    line-height: 1.8;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }
  .prayer-title .ur-name {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 17px;
    font-weight: 700;
    line-height: 2.2;
    direction: rtl;
    unicode-bidi: embed;
  }
  .prayer-title .en-part {
    font-family: -apple-system, sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: #1b5e20;
  }
  .prayer-title .other-part {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 13px;
    color: #888;
    font-weight: 400;
    line-height: 2;
    direction: rtl;
    unicode-bidi: embed;
  }
  .field-group { margin-bottom: 12px; }
  .field-label {
    font-size: 12px;
    color: #555;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .field-label.urdu-label {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 15px;
    line-height: 2.2;
    color: #1b5e20;
    font-weight: 600;
    direction: rtl;
    text-align: right;
    unicode-bidi: embed;
    padding-bottom: 4px;
  }
  textarea {
    width: 100%;
    padding: 8px 10px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    min-height: 50px;
    color: #1a1a1a;
  }
  textarea:focus { outline: none; border-color: #1b5e20; }
  textarea.urdu-input {
    font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif !important;
    font-size: 17px;
    line-height: 2.2;
    min-height: 70px;
    padding: 10px 14px;
    font-weight: 600;
    direction: rtl;
    text-align: right;
    color: #1a1a1a;
    unicode-bidi: embed;
  }
  textarea.urdu-input::placeholder {
    color: #aaa;
    font-weight: 400;
  }
  .transliterate-btn {
    background: #ff9800;
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
    margin-top: 6px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .transliterate-btn:hover { background: #f57c00; }
  .transliterate-btn:disabled { background: #bbb; cursor: not-allowed; }
  .transliterate-btn .ur-text {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 14px;
    line-height: 1.8;
    direction: rtl;
    unicode-bidi: embed;
  }
  .preview-box {
    background: #1b5e20;
    color: white;
    padding: 14px;
    border-radius: 8px;
    margin-top: 6px;
    text-align: center;
    font-size: 15px;
    font-weight: bold;
    min-height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 2;
    word-wrap: break-word;
  }
  .preview-box.urdu-preview-box {
    font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif !important;
    direction: rtl;
    font-size: 17px;
    line-height: 2.6;
    padding: 18px 12px;
    font-weight: 700;
  }
  .preview-box.en-preview-box {
    background: #2e7d32;
    font-family: -apple-system, sans-serif;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.6;
    padding: 14px 12px;
    margin-top: 4px;
  }
  .preview-label-small {
    font-size: 11px;
    color: #666;
    font-weight: 600;
    margin-top: 6px;
    margin-bottom: 3px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .save-btn {
    background: #1b5e20;
    color: white;
    border: none;
    padding: 11px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .save-btn:hover { background: #2e7d32; }
  .save-btn:disabled { background: #999; cursor: not-allowed; }
  .save-btn.saved { background: #2e7d32; }
  .save-btn .btn-urdu {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 15px;
    line-height: 1.9;
    direction: rtl;
    unicode-bidi: embed;
    display: inline-block;
  }
  .save-btn .btn-en {
    font-family: -apple-system, sans-serif;
    font-size: 14px;
    font-weight: bold;
  }
  .status-msg {
    text-align: center;
    font-size: 13px;
    margin-top: 8px;
    min-height: 18px;
    font-weight: 600;
    line-height: 1.8;
  }
  .status-msg.nastaliq {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 14px;
    line-height: 2.2;
    direction: rtl;
    unicode-bidi: embed;
  }
  .status-msg.success { color: #1b5e20; }
  .status-msg.error { color: #c62828; }
  .loading {
    text-align: center;
    padding: 30px;
    color: #666;
    font-size: 14px;
  }
  .refresh-btn {
    background: white;
    color: #1b5e20;
    border: 2px solid #1b5e20;
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .refresh-btn:hover { background: #e8f5e9; }

  /* ============ NAMES SECTION ============ */
  .names-section {
    background: white;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
    border-left: 4px solid #ff9800;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .names-section h2 {
    color: #e65100;
    margin-bottom: 12px;
    font-size: 16px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .names-section h2 .ur-heading {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 17px;
    line-height: 2.2;
    direction: rtl;
    unicode-bidi: embed;
    color: #e65100;
  }
  .name-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .name-row .prayer-label {
    flex: 1;
    min-width: 70px;
    font-weight: bold;
    color: #333;
    font-size: 13px;
  }
  .name-row input.name-ur {
    flex: 2;
    min-width: 110px;
    padding: 8px 10px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 16px;
    direction: rtl;
    text-align: right;
    line-height: 2;
    unicode-bidi: embed;
  }
  .name-row input.name-ur:focus { outline: none; border-color: #e65100; }
  .name-row input.name-en {
    flex: 2;
    min-width: 110px;
    padding: 8px 10px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
  }
  .name-row input.name-en:focus { outline: none; border-color: #e65100; }
  .names-save-btn {
    background: #e65100;
    color: white;
    border: none;
    padding: 11px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .names-save-btn:hover { background: #ef6c00; }
  .names-save-btn .btn-urdu {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 15px;
    line-height: 1.9;
    direction: rtl;
    unicode-bidi: embed;
  }
  .names-status {
    text-align: center;
    font-size: 13px;
    margin-top: 8px;
    min-height: 18px;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="header">
  <h1 id="pageTitle" class="nastaliq">📿 نماز کے پیغامات</h1>
  <div class="lang-toggle">
    <button class="lang-btn nastaliq active" id="btn-ur" onclick="setLang('ur')">اردو</button>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
  </div>
</div>

<div class="top-nav">
  <a href="/admin.html">← Admin Panel</a>
</div>

<div style="text-align:center;">
  <button class="refresh-btn" onclick="loadMessages(); loadPrayerNames();">🔄 Reload</button>
</div>

<!-- ============ PRAYER NAMES EDITOR ============ -->
<div class="names-section">
  <h2>
    🕌 Prayer Names / <span class="ur-heading">نام تبدیل کریں</span>
  </h2>
  <div id="names-container"></div>
  <button class="names-save-btn" onclick="saveAllNames()">
    💾 Save All Names / <span class="btn-urdu">تمام نام محفوظ کریں</span>
  </button>
  <div class="names-status" id="names-status"></div>
</div>

<div id="loading" class="loading">Loading messages...</div>
<div id="messages-container"></div>

<script>
const API_BASE = 'https://zahidiya-mysore.pages.dev';

const PRAYERS = [
  { key: 'Fajr',    ur: 'فجر',    en: 'Fajr' },
  { key: 'Dhuhr',   ur: 'ظہر',    en: 'Dhuhr' },
  { key: 'Asr',     ur: 'عصر',    en: 'Asr' },
  { key: 'Maghrib', ur: 'مغرب',   en: 'Maghrib' },
  { key: 'Isha',    ur: 'عشاء',   en: 'Isha' },
];

const TYPES = [
  { key: 'start', ur: 'شروع',  en: 'Start' },
  { key: 'end',   ur: 'ختم',   en: 'End' },
];

let currentLang = 'ur';
let messagesData = {};

if (document.fonts) {
  Promise.all([
    document.fonts.load('400 17px "Noto Nastaliq Urdu"'),
    document.fonts.load('600 17px "Noto Nastaliq Urdu"'),
    document.fonts.load('700 17px "Noto Nastaliq Urdu"')
  ]).then(() => {
    if (document.getElementById('messages-container')) {
      updateLabels();
    }
  }).catch(() => {});
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('msg_admin_lang', lang);

  const btnUr = document.getElementById('btn-ur');
  btnUr.classList.add('nastaliq');
  if (lang === 'ur') {
    btnUr.classList.add('active');
  } else {
    btnUr.classList.remove('active');
  }

  const btnEn = document.getElementById('btn-en');
  if (lang === 'en') {
    btnEn.classList.add('active');
  } else {
    btnEn.classList.remove('active');
  }

  updateLabels();
}

function updateLabels() {
  const titleEl = document.getElementById('pageTitle');
  if (currentLang === 'ur') {
    titleEl.textContent = '📿 نماز کے پیغامات';
    titleEl.classList.add('nastaliq');
  } else {
    titleEl.textContent = '📿 Namaz Messages';
    titleEl.classList.remove('nastaliq');
  }

  PRAYERS.forEach(p => {
    TYPES.forEach(t => {
      const key = p.key + '_' + t.key;
      const titleCard = document.getElementById('title_' + key);
      const urLabel = document.getElementById('label_ur_' + key);
      const enLabel = document.getElementById('label_en_' + key);
      const previewLabel = document.getElementById('label_preview_' + key);
      const saveBtn = document.getElementById('btn_' + key);
      const statusEl = document.getElementById('status_' + key);

      if (titleCard) {
        if (currentLang === 'ur') {
          titleCard.innerHTML = `🕌 <span class="ur-name">${p.ur} — ${t.ur}</span> <span class="other-part">(${p.en} — ${t.en})</span>`;
        } else {
          titleCard.innerHTML = `🕌 <span class="en-part">${p.en} — ${t.en}</span> <span class="other-part">(${p.ur} — ${t.ur})</span>`;
        }
      }
      if (urLabel) urLabel.textContent = currentLang === 'ur' ? 'اردو پیغام:' : 'Urdu message:';
      if (enLabel) {
        enLabel.textContent = currentLang === 'ur' ? 'انگریزی / رومن اردو:' : 'English / Roman Urdu:';
        enLabel.classList.toggle('urdu-label', currentLang === 'ur');
      }
      if (previewLabel) {
        previewLabel.textContent = currentLang === 'ur' ? 'پیش نظارہ:' : 'Preview:';
        previewLabel.classList.toggle('urdu-label', currentLang === 'ur');
      }
      if (saveBtn) {
        saveBtn.innerHTML = `<span class="btn-urdu">💾 محفوظ کریں</span> <span class="btn-en">/ Save</span>`;
      }
      if (statusEl) {
        statusEl.classList.toggle('nastaliq', currentLang === 'ur');
      }
    });
  });
}

async function loadMessages() {
  const loading = document.getElementById('loading');
  const container = document.getElementById('messages-container');
  loading.style.display = 'block';
  loading.textContent = 'Loading messages...';
  container.innerHTML = '';

  try {
    const res = await fetch(API_BASE + '/api/get-prayer-messages');
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Failed to load');

    messagesData = {};
    data.messages.forEach(m => {
      messagesData[m.prayer + '_' + m.msg_type] = {
        ur: m.message_ur || '',
        en: m.message_en || ''
      };
    });
    renderMessages();
    loading.style.display = 'none';
    updateLabels();
  } catch (e) {
    loading.innerHTML = '❌ Error: ' + e.message;
  }
}

function renderMessages() {
  const container = document.getElementById('messages-container');
  container.innerHTML = '';

  PRAYERS.forEach(prayer => {
    TYPES.forEach(type => {
      const key = prayer.key + '_' + type.key;
      const msg = messagesData[key] || { ur: '', en: '' };
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="prayer-title" id="title_${key}">
          🕌 <span class="ur-name">${prayer.ur} — ${type.ur}</span> <span class="other-part">(${prayer.en} — ${type.en})</span>
        </div>
        <div class="field-group">
          <div class="field-label urdu-label" id="label_ur_${key}">اردو پیغام:</div>
          <textarea class="urdu-input" id="ur_${key}" placeholder="یہاں اردو پیغام لکھیں..." spellcheck="false">${escapeHtml(msg.ur)}</textarea>
        </div>
        <div class="field-group">
          <div class="field-label urdu-label" id="label_en_${key}">انگریزی / رومن اردو:</div>
          <textarea id="en_${key}" placeholder="Type in English / Roman Urdu...">${escapeHtml(msg.en)}</textarea>
          <button class="transliterate-btn" id="trans_btn_${key}" onclick="transliterate('${key}')">
            <span class="ur-text">✨ اردو میں تبدیل کریں</span>
          </button>
        </div>
        <div class="field-group">
          <div class="field-label urdu-label" id="label_preview_${key}">پیش نظارہ:</div>
          <div class="preview-label-small">URDU PREVIEW</div>
          <div class="preview-box urdu-preview-box" id="preview_ur_${key}">${escapeHtml(msg.ur) || '...'}</div>
          <div class="preview-label-small">ENGLISH PREVIEW</div>
          <div class="preview-box en-preview-box" id="preview_en_${key}">${escapeHtml(msg.en) || '...'}</div>
        </div>
        <button class="save-btn" id="btn_${key}" onclick="saveMessage('${prayer.key}', '${type.key}')">
          <span class="btn-urdu">💾 محفوظ کریں</span> <span class="btn-en">/ Save</span>
        </button>
        <div class="status-msg nastaliq" id="status_${key}"></div>
      `;
      container.appendChild(card);

      setTimeout(() => {
        const urInput = document.getElementById('ur_' + key);
        const enInput = document.getElementById('en_' + key);

        if (urInput) {
          urInput.addEventListener('input', e => {
            document.getElementById('preview_ur_' + key).textContent = e.target.value || '...';
          });
        }
        if (enInput) {
          enInput.addEventListener('input', e => {
            document.getElementById('preview_en_' + key).textContent = e.target.value || '...';
          });
        }
      }, 0);
    });
  });
}

async function transliterate(key) {
  const enText = document.getElementById('en_' + key).value.trim();
  const urTextarea = document.getElementById('ur_' + key);
  const btn = document.getElementById('trans_btn_' + key);

  if (!enText) {
    alert('پہلے انگریزی / رومن اردو میں کچھ لکھیں');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = `<span class="ur-text">⏳ تبدیل ہو رہا ہے...</span>`;

  try {
    const url = `https://inputtools.google.com/request?text=${encodeURIComponent(enText)}&itc=ur-t-i0-und&num=1&cp=0&cs=1&ie=utf-8&oe=utf-8`;
    const res = await fetch(url);
    const data = await res.json();

    if (data && data[0] === 'SUCCESS') {
      const suggestions = data[1][0][1];
      if (suggestions && suggestions.length > 0) {
        const urduText = suggestions[0];
        urTextarea.value = urduText;
        document.getElementById('preview_ur_' + key).textContent = urduText;
        btn.innerHTML = `<span class="ur-text">✅ ہو گیا</span>`;
        setTimeout(() => {
          btn.innerHTML = `<span class="ur-text">✨ اردو میں تبدیل کریں</span>`;
        }, 1500);
      } else {
        btn.innerHTML = `<span class="ur-text">❌ نہیں ہو سکا</span>`;
      }
    } else {
      btn.innerHTML = `<span class="ur-text">❌ نہیں ہو سکا</span>`;
    }
  } catch (e) {
    btn.innerHTML = `<span class="ur-text">❌ نیٹ ورک مسئلہ</span>`;
  } finally {
    btn.disabled = false;
    setTimeout(() => {
      btn.innerHTML = `<span class="ur-text">✨ اردو میں تبدیل کریں</span>`;
    }, 2500);
  }
}

async function saveMessage(prayer, msgType) {
  const key = prayer + '_' + msgType;
  const ur = document.getElementById('ur_' + key).value;
  const en = document.getElementById('en_' + key).value;
  const btn = document.getElementById('btn_' + key);
  const status = document.getElementById('status_' + key);

  btn.disabled = true;
  btn.innerHTML = `<span class="btn-urdu">⏳ محفوظ ہو رہا ہے...</span>`;
  status.textContent = '';
  status.className = 'status-msg nastaliq';

  try {
    const res = await fetch(API_BASE + '/api/save-prayer-message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prayer: prayer,
        msg_type: msgType,
        message_ur: ur,
        message_en: en
      })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Save failed');

    status.textContent = currentLang === 'ur' ? '✅ کامیابی سے محفوظ ہو گیا' : '✅ Saved successfully';
    status.className = 'status-msg nastaliq success';
    btn.classList.add('saved');
    setTimeout(() => {
      status.textContent = '';
      btn.classList.remove('saved');
    }, 3000);
  } catch (e) {
    status.textContent = '❌ ' + e.message;
    status.className = 'status-msg nastaliq error';
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<span class="btn-urdu">💾 محفوظ کریں</span> <span class="btn-en">/ Save</span>`;
  }
}

// ============ PRAYER NAMES EDITOR ============
async function loadPrayerNames() {
  const container = document.getElementById('names-container');
  if (!container) return;

  try {
    const res = await fetch(API_BASE + '/api/get-prayer-names');
    const data = await res.json();
    if (!data.success) throw new Error(data.error);

    container.innerHTML = '';
    data.names.forEach(n => {
      const row = document.createElement('div');
      row.className = 'name-row';
      row.innerHTML = `
        <div class="prayer-label">${n.prayer}</div>
        <input class="name-ur" id="name_ur_${n.prayer}" value="${escapeHtml(n.name_ur)}" placeholder="اردو نام">
        <input class="name-en" id="name_en_${n.prayer}" value="${escapeHtml(n.name_en)}" placeholder="English name">
      `;
      container.appendChild(row);
    });
  } catch (e) {
    container.innerHTML = '<div style="color:#c62828;">❌ ' + e.message + '</div>';
  }
}

async function saveAllNames() {
  const status = document.getElementById('names-status');
  const prayers = ['Fajr','Dhuhr','Asr','Maghrib','Isha'];
  status.textContent = '⏳ Saving...';
  status.style.color = '#e65100';

  try {
    for (const p of prayers) {
      const ur = document.getElementById('name_ur_' + p).value;
      const en = document.getElementById('name_en_' + p).value;
      await fetch(API_BASE + '/api/save-prayer-name', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prayer: p, name_ur: ur, name_en: en })
      });
    }
    status.textContent = '✅ All names saved successfully';
    status.style.color = '#1b5e20';
    setTimeout(() => { status.textContent = ''; }, 3000);
  } catch (e) {
    status.textContent = '❌ ' + e.message;
    status.style.color = '#c62828';
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

window.onload = () => {
  const savedLang = localStorage.getItem('msg_admin_lang') || 'ur';
  setLang(savedLang);
  loadMessages();
  loadPrayerNames();
};
</script>
