<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namaz Messages — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" as="style">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f5f0;
    color: #1a1a1a;
    padding: 16px;
    line-height: 1.5;
  }
  .nastaliq {
    font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif !important;
    direction: rtl;
    unicode-bidi: embed;
    line-height: 2.6;
  }
  .header {
    background: #1b5e20;
    color: white;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
  }
  .header h1.nastaliq {
    font-size: 24px;
    line-height: 2.8;
  }
  .lang-toggle { display: flex; gap: 8px; }
  .lang-btn {
    padding: 8px 16px;
    border: 2px solid white;
    background: transparent;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
  }
  .lang-btn.active { background: white; color: #1b5e20; }
  .lang-btn.nastaliq {
    font-size: 16px;
    line-height: 2;
    padding: 4px 20px;
  }
  .card {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    border-left: 4px solid #1b5e20;
  }
  .prayer-title {
    font-size: 18px;
    font-weight: 700;
    color: #1b5e20;
    margin-bottom: 14px;
    line-height: 2;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .prayer-title .ur-name {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 22px;
    font-weight: 700;
    line-height: 2.6;
    direction: rtl;
    unicode-bidi: embed;
  }
  .prayer-title .en-part {
    font-family: -apple-system, sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: #1b5e20;
  }
  .prayer-title .other-part {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 16px;
    color: #888;
    font-weight: 400;
    line-height: 2.4;
    direction: rtl;
    unicode-bidi: embed;
  }
  .field-group { margin-bottom: 16px; }
  .field-label {
    font-size: 13px;
    color: #555;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .field-label.urdu-label {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 18px;
    line-height: 2.6;
    color: #1b5e20;
    font-weight: 600;
    direction: rtl;
    text-align: right;
    unicode-bidi: embed;
    padding-bottom: 4px;
  }
  textarea {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
    min-height: 70px;
    color: #1a1a1a;
  }
  textarea:focus { outline: none; border-color: #1b5e20; }
  textarea.urdu-input {
    font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif !important;
    font-size: 22px;
    line-height: 3;
    min-height: 130px;
    padding: 16px 18px;
    font-weight: 600;
    direction: rtl;
    text-align: right;
    color: #1a1a1a;
    unicode-bidi: embed;
  }
  textarea.urdu-input::placeholder {
    color: #aaa;
    font-weight: 400;
  }
  .preview-box {
    background: #1b5e20;
    color: white;
    padding: 20px;
    border-radius: 8px;
    margin-top: 8px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 2.4;
  }
  .preview-box.nastaliq {
    font-size: 24px;
    line-height: 3.2;
    padding: 28px 16px;
    font-weight: 700;
  }
  .save-btn {
    background: #1b5e20;
    color: white;
    border: none;
    padding: 14px 24px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .save-btn:hover { background: #2e7d32; }
  .save-btn:disabled { background: #999; cursor: not-allowed; }
  .save-btn.saved { background: #2e7d32; }
  .save-btn .btn-urdu {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 18px;
    line-height: 2.2;
    direction: rtl;
    unicode-bidi: embed;
    display: inline-block;
  }
  .save-btn .btn-en {
    font-family: -apple-system, sans-serif;
    font-size: 16px;
    font-weight: bold;
  }
  .status-msg {
    text-align: center;
    font-size: 14px;
    margin-top: 10px;
    min-height: 22px;
    font-weight: 600;
    line-height: 2;
  }
  .status-msg.nastaliq {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 16px;
    line-height: 2.4;
    direction: rtl;
    unicode-bidi: embed;
  }
  .status-msg.success { color: #1b5e20; }
  .status-msg.error { color: #c62828; }
  .loading {
    text-align: center;
    padding: 40px;
    color: #666;
    font-size: 16px;
  }
  .refresh-btn {
    background: white;
    color: #1b5e20;
    border: 2px solid #1b5e20;
    padding: 10px 24px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 15px;
    margin-bottom: 16px;
  }
  .refresh-btn:hover { background: #e8f5e9; }
  .top-nav {
    text-align: center;
    margin-bottom: 16px;
  }
  .top-nav a {
    color: #1b5e20;
    text-decoration: none;
    font-weight: bold;
    padding: 10px 20px;
    border: 2px solid #1b5e20;
    border-radius: 8px;
    display: inline-block;
    background: white;
    font-size: 14px;
  }
  .top-nav a:hover { background: #e8f5e9; }
</style>
</head>
<body>

<div class="header">
  <h1 id="pageTitle" class="nastaliq">📿 نماز کے پیغامات</h1>
  <div class="lang-toggle">
    <button class="lang-btn active nastaliq" id="btn-ur" onclick="setLang('ur')">اردو</button>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
  </div>
</div>

<div class="top-nav">
  <a href="/admin.html">← Admin Panel</a>
</div>

<div style="text-align:center;">
  <button class="refresh-btn" onclick="loadMessages()">🔄 Reload</button>
</div>

<div id="loading" class="loading">Loading messages...</div>
<div id="messages-container"></div>

<script>
const API_BASE = 'https://zahidiya-mysore.pages.dev';

const PRAYERS = [
  { key: 'Fajr',    ur: 'فجر',    en: 'Fajr' },
  { key: 'Dhuhr',   ur: 'ظہر',    en: 'Dhuhr' },
  { key: 'Asr',     ur: 'عصر',    en: 'Asr' },
  { key: 'Maghrib', ur: 'مغرب',   en: 'Maghrib' },
  { key: 'Isha',    ur: 'عشاء',   en: 'Isha' },
];

const TYPES = [
  { key: 'start', ur: 'شروع',  en: 'Start' },
  { key: 'end',   ur: 'ختم',   en: 'End' },
];

let currentLang = 'ur';
let messagesData = {};

if (document.fonts) {
  Promise.all([
    document.fonts.load('400 22px "Noto Nastaliq Urdu"'),
    document.fonts.load('600 22px "Noto Nastaliq Urdu"'),
    document.fonts.load('700 24px "Noto Nastaliq Urdu"')
  ]).then(() => {
    if (document.getElementById('messages-container')) {
      updateLabels();
    }
  }).catch(() => {});
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('msg_admin_lang', lang);
  document.getElementById('btn-ur').classList.toggle('active', lang === 'ur');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-ur').classList.toggle('nastaliq', lang === 'ur');
  updateLabels();
}

function updateLabels() {
  const titleEl = document.getElementById('pageTitle');
  if (currentLang === 'ur') {
    titleEl.textContent = '📿 نماز کے پیغامات';
    titleEl.classList.add('nastaliq');
  } else {
    titleEl.textContent = '📿 Namaz Messages';
    titleEl.classList.remove('nastaliq');
  }

  PRAYERS.forEach(p => {
    TYPES.forEach(t => {
      const key = p.key + '_' + t.key;
      const titleCard = document.getElementById('title_' + key);
      const urLabel = document.getElementById('label_ur_' + key);
      const enLabel = document.getElementById('label_en_' + key);
      const previewLabel = document.getElementById('label_preview_' + key);
      const saveBtn = document.getElementById('btn_' + key);
      const statusEl = document.getElementById('status_' + key);

      if (titleCard) {
        if (currentLang === 'ur') {
          titleCard.innerHTML = `🕌 <span class="ur-name">${p.ur} — ${t.ur}</span> <span class="other-part">(${p.en} — ${t.en})</span>`;
        } else {
          titleCard.innerHTML = `🕌 <span class="en-part">${p.en} — ${t.en}</span> <span class="other-part">(${p.ur} — ${t.ur})</span>`;
        }
      }
      if (urLabel) urLabel.textContent = currentLang === 'ur' ? 'اردو پیغام:' : 'Urdu message:';
      if (enLabel) {
        enLabel.textContent = currentLang === 'ur' ? 'انگریزی / رومن اردو:' : 'English / Roman Urdu:';
        enLabel.classList.toggle('urdu-label', currentLang === 'ur');
      }
      if (previewLabel) {
        previewLabel.textContent = currentLang === 'ur' ? 'پیش نظارہ:' : 'Preview:';
        previewLabel.classList.toggle('urdu-label', currentLang === 'ur');
      }
      if (saveBtn) {
        saveBtn.innerHTML = `<span class="btn-urdu">💾 محفوظ کریں</span> <span class="btn-en">/ Save</span>`;
      }
      if (statusEl) {
        statusEl.classList.toggle('nastaliq', currentLang === 'ur');
      }
    });
  });
}

async function loadMessages() {
  const loading = document.getElementById('loading');
  const container = document.getElementById('messages-container');
  loading.style.display = 'block';
  loading.textContent = 'Loading messages...';
  container.innerHTML = '';

  try {
    const res = await fetch(API_BASE + '/api/get-prayer-messages');
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Failed to load');

    messagesData = {};
    data.messages.forEach(m => {
      messagesData[m.prayer + '_' + m.msg_type] = {
        ur: m.message_ur || '',
        en: m.message_en || ''
      };
    });
    renderMessages();
    loading.style.display = 'none';
    updateLabels();
  } catch (e) {
    loading.innerHTML = '❌ Error: ' + e.message;
  }
}

function renderMessages() {
  const container = document.getElementById('messages-container');
  container.innerHTML = '';

  PRAYERS.forEach(prayer => {
    TYPES.forEach(type => {
      const key = prayer.key + '_' + type.key;
      const msg = messagesData[key] || { ur: '', en: '' };
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="prayer-title" id="title_${key}">
          🕌 <span class="ur-name">${prayer.ur} — ${type.ur}</span> <span class="other-part">(${prayer.en} — ${type.en})</span>
        </div>
        <div class="field-group">
          <div class="field-label urdu-label" id="label_ur_${key}">اردو پیغام:</div>
          <textarea class="urdu-input" id="ur_${key}" placeholder="یہاں اردو پیغام لکھیں..." spellcheck="false">${escapeHtml(msg.ur)}</textarea>
        </div>
        <div class="field-group">
          <div class="field-label urdu-label" id="label_en_${key}">انگریزی / رومن اردو:</div>
          <textarea id="en_${key}" placeholder="Enter English / Roman message...">${escapeHtml(msg.en)}</textarea>
        </div>
        <div class="field-group">
          <div class="field-label urdu-label" id="label_preview_${key}">پیش نظارہ:</div>
          <div class="preview-box nastaliq" id="preview_${key}">${escapeHtml(msg.ur) || '...'}</div>
        </div>
        <button class="save-btn" id="btn_${key}" onclick="saveMessage('${prayer.key}', '${type.key}')">
          <span class="btn-urdu">💾 محفوظ کریں</span> <span class="btn-en">/ Save</span>
        </button>
        <div class="status-msg nastaliq" id="status_${key}"></div>
      `;
      container.appendChild(card);

      setTimeout(() => {
        const urInput = document.getElementById('ur_' + key);
        if (urInput) {
          urInput.addEventListener('input', e => {
            document.getElementById('preview_' + key).textContent = e.target.value || '...';
          });
        }
      }, 0);
    });
  });
}

async function saveMessage(prayer, msgType) {
  const key = prayer + '_' + msgType;
  const ur = document.getElementById('ur_' + key).value;
  const en = document.getElementById('en_' + key).value;
  const btn = document.getElementById('btn_' + key);
  const status = document.getElementById('status_' + key);

  btn.disabled = true;
  btn.innerHTML = `<span class="btn-urdu">⏳ محفوظ ہو رہا ہے...</span>`;
  status.textContent = '';
  status.className = 'status-msg nastaliq';

  try {
    const res = await fetch(API_BASE + '/api/save-prayer-message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prayer: prayer,
        msg_type: msgType,
        message_ur: ur,
        message_en: en
      })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Save failed');

    status.textContent = currentLang === 'ur' ? '✅ کامیابی سے محفوظ ہو گیا' : '✅ Saved successfully';
    status.className = 'status-msg nastaliq success';
    btn.classList.add('saved');
    setTimeout(() => {
      status.textContent = '';
      btn.classList.remove('saved');
    }, 3000);
  } catch (e) {
    status.textContent = '❌ ' + e.message;
    status.className = 'status-msg nastaliq error';
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<span class="btn-urdu">💾 محفوظ کریں</span> <span class="btn-en">/ Save</span>`;
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

window.onload = () => {
  const savedLang = localStorage.getItem('msg_admin_lang') || 'ur';
  setLang(savedLang);
  loadMessages();
};
</script>

</body>
</html>
