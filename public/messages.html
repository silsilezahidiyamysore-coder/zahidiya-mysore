<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namaz Messages — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f5f0; color: #1a1a1a; padding: 16px; line-height: 1.5; }
  .nastaliq { font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif !important; direction: rtl; line-height: 2.4; }
  .header { background: #1b5e20; color: white; padding: 14px; border-radius: 12px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header h1.nastaliq { font-size: 20px; line-height: 2.8; }
  .lang-toggle { display: flex; gap: 8px; }
  .lang-btn { padding: 6px 16px; border: 2px solid white; background: transparent; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; }
  .lang-btn.active { background: white; color: #1b5e20; }
  .lang-btn.nastaliq { font-size: 15px; padding: 6px 20px; }
  .top-nav { text-align: center; margin-bottom: 14px; }
  .top-nav a { color: #1b5e20; text-decoration: none; font-weight: bold; padding: 8px 18px; border: 2px solid #1b5e20; border-radius: 8px; display: inline-block; background: white; font-size: 13px; }
  .card { background: white; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); border-left: 4px solid #1b5e20; }
  .prayer-title { font-size: 15px; font-weight: 700; color: #1b5e20; margin-bottom: 10px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; line-height: 1.8; }
  .prayer-title .ur-name { font-size: 17px; font-weight: 700; line-height: 2.4; }
  .prayer-title .en-part { font-size: 14px; font-weight: 600; }
  .prayer-title .other-part { font-size: 13px; color: #888; font-weight: 400; line-height: 2.2; }
  .field-group { margin-bottom: 12px; }
  .field-label { font-size: 12px; color: #555; margin-bottom: 6px; font-weight: 600; }
  .field-label.urdu-label { font-size: 15px; line-height: 2.4; color: #1b5e20; font-weight: 600; text-align: right; padding-bottom: 4px; }
  textarea { width: 100%; padding: 8px 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; font-family: inherit; resize: vertical; min-height: 50px; }
  textarea:focus { outline: none; border-color: #1b5e20; }
  textarea.urdu-input { font-size: 17px; line-height: 2.4; min-height: 70px; padding: 10px 14px; font-weight: 600; text-align: right; }
  textarea.urdu-input.auto-filled { background: #f1f8e9; border-color: #66bb6a; }
  .auto-hint { font-size: 11px; color: #2e7d32; margin-top: 4px; font-style: italic; display: none; padding: 4px 8px; background: #e8f5e9; border-radius: 4px; }
  .auto-hint.show { display: block; }
  .auto-hint.loading { color: #e65100; background: #fff3e0; }
  .auto-hint.error { color: #c62828; background: #ffebee; }
  .preview-box { background: #1b5e20; color: white; padding: 14px; border-radius: 8px; margin-top: 6px; text-align: center; font-size: 15px; font-weight: bold; min-height: 55px; display: flex; align-items: center; justify-content: center; line-height: 2; word-wrap: break-word; }
  .preview-box.urdu-preview-box { font-size: 17px; line-height: 2.8; padding: 18px 12px; font-weight: 700; }
  .preview-box.en-preview-box { background: #2e7d32; font-size: 15px; font-weight: 600; line-height: 1.6; padding: 14px 12px; margin-top: 4px; }
  .preview-label-small { font-size: 11px; color: #666; font-weight: 600; margin-top: 6px; margin-bottom: 3px; text-transform: uppercase; }
  .save-btn { background: #1b5e20; color: white; border: none; padding: 11px 20px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; }
  .save-btn:disabled { background: #999; }
  .save-btn.saved { background: #2e7d32; }
  .refresh-btn { background: white; color: #1b5e20; border: 2px solid #1b5e20; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; margin-bottom: 14px; }
  .status-msg { text-align: center; font-size: 13px; margin-top: 8px; min-height: 18px; font-weight: 600; }
  .status-msg.success { color: #1b5e20; }
  .status-msg.error { color: #c62828; }
  .loading { text-align: center; padding: 30px; color: #666; font-size: 14px; }
  .names-section, .settings-section { background: white; border-radius: 12px; padding: 14px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
  .names-section { border-left: 4px solid #ff9800; }
  .settings-section { border-left: 4px solid #2196f3; }
  .section-heading { margin-bottom: 12px; font-size: 16px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; line-height: 2.2; }
  .names-section .section-heading { color: #e65100; }
  .settings-section .section-heading { color: #0d47a1; }
  .name-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  .name-row .prayer-label { flex: 1; min-width: 70px; font-weight: bold; color: #333; font-size: 13px; }
  .name-row input.name-ur { flex: 2; min-width: 110px; padding: 8px 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; font-weight: 600; text-align: right; line-height: 2.2; }
  .name-row input.name-ur.auto-filled { background: #f1f8e9; border-color: #66bb6a; }
  .name-row input.name-en { flex: 2; min-width: 110px; padding: 8px 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; }
  .name-hint { font-size: 10px; color: #2e7d32; display: none; margin-left: 4px; }
  .name-hint.show { display: inline; }
  .settings-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .settings-row label { flex: 1; min-width: 180px; font-size: 14px; font-weight: 600; color: #333; line-height: 1.8; }
  .settings-row label.urdu-label { font-size: 16px; text-align: right; }
  .settings-row input { flex: 1; min-width: 100px; padding: 10px 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; font-weight: 600; text-align: center; }
  .settings-row input:focus { outline: none; border-color: #2196f3; }
  .names-save-btn, .settings-save-btn { color: white; border: none; padding: 11px 20px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
  .names-save-btn { background: #e65100; }
  .settings-save-btn { background: #0d47a1; }
  .names-status, .settings-status { text-align: center; font-size: 13px; margin-top: 8px; min-height: 18px; font-weight: 600; }
</style>
</head>
<body>

<div class="header">
  <h1 id="pageTitle" class="nastaliq">📿 نماز کے پیغامات</h1>
  <div class="lang-toggle">
    <button class="lang-btn nastaliq active" id="btn-ur" onclick="setLang('ur')">اردو</button>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
  </div>
</div>

<div class="top-nav">
  <a href="/admin.html">← Admin Panel</a>
</div>

<div style="text-align:center;">
  <button class="refresh-btn" onclick="loadAll()" id="reloadBtn">🔄 Reload</button>
</div>

<div class="names-section">
  <h2 class="section-heading" id="namesHeading"></h2>
  <div id="names-container"></div>
  <button class="names-save-btn" onclick="saveAllNames()" id="saveNamesBtn"></button>
  <div class="names-status" id="names-status"></div>
</div>

<div class="settings-section">
  <h2 class="section-heading" id="settingsHeading"></h2>
  <div id="settings-container"></div>
  <button class="settings-save-btn" onclick="saveAlarmSettings()" id="saveSettingsBtn"></button>
  <div class="settings-status" id="settings-status"></div>
</div>

<div id="loading" class="loading">Loading messages...</div>
<div id="messages-container"></div>

<script>
const API_BASE = 'https://zahidiya-mysore.pages.dev';

const PRAYERS = [
  { key: 'Fajr',    ur: 'فجر',    en: 'Fajr' },
  { key: 'Dhuhr',   ur: 'ظہر',    en: 'Dhuhr' },
  { key: 'Asr',     ur: 'عصر',    en: 'Asr' },
  { key: 'Maghrib', ur: 'مغرب',   en: 'Maghrib' },
  { key: 'Isha',    ur: 'عشاء',   en: 'Isha' },
];

const TYPES = [
  { key: 'start', ur: 'شروع',  en: 'Start' },
  { key: 'end',   ur: 'ختم',   en: 'End' },
];

// Alarm settings fields — Har field ke 3 naam:
// en: English label
// ru: Roman Urdu label
// ur: Urdu Nastaliq label
const SETTINGS_FIELDS = [
  {
    key: 'start_alarm_duration_seconds',
    en: 'Start Alarm Duration (seconds)',
    ru: 'Namaz shuru hone par alarm kitne second bajega',
    ur: 'نماز شروع ہونے پر الارم کتنے سیکنڈ بجے گا',
  },
  {
    key: 'end_reminder_minutes_before',
    en: 'End Reminder Minutes Before',
    ru: 'Namaz khatam hone se kitne minute pehle reminder',
    ur: 'نماز ختم ہونے سے کتنے منٹ پہلے یاد دہانی',
  },
  {
    key: 'end_reminder_beep_seconds',
    en: 'Beep Duration (seconds)',
    ru: 'Har beep kitne second',
    ur: 'ہر بلیپ کتنے سیکنڈ',
  },
  {
    key: 'end_reminder_beep_count',
    en: 'Number of Beeps',
    ru: 'Kitni baar beep bajegi',
    ur: 'کتنی بار بلیپ بجے گی',
  },
];

let currentLang = 'ur';
let messagesData = {};
let namesData = [];
let settingsData = {};
let autoTransTimers = {};
let nameAutoTransTimers = {};

function urduSpan(text, extraClass) {
  return `<span class="nastaliq ${extraClass || ''}">${text}</span>`;
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('msg_admin_lang', lang);
  document.getElementById('btn-ur').classList.toggle('active', lang === 'ur');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  updateAllLabels();
}

function updateAllLabels() {
  const ur = currentLang === 'ur';

  const titleEl = document.getElementById('pageTitle');
  if (ur) { titleEl.innerHTML = `📿 ${urduSpan('نماز کے پیغامات')}`; titleEl.classList.add('nastaliq'); }
  else { titleEl.textContent = '📿 Namaz Messages'; titleEl.classList.remove('nastaliq'); }

  document.getElementById('reloadBtn').innerHTML = ur ? `🔄 ${urduSpan('دوبارہ لوڈ کریں')}` : '🔄 Reload';

  document.getElementById('namesHeading').innerHTML = ur
    ? `🕌 ${urduSpan('نماز کے نام تبدیل کریں')}` : '🕌 Prayer Names (Edit)';
  document.getElementById('saveNamesBtn').innerHTML = ur
    ? `💾 ${urduSpan('تمام نام محفوظ کریں')}` : '💾 Save All Names';

  document.getElementById('settingsHeading').innerHTML = ur
    ? `⚙️ ${urduSpan('الارم کی ترتیبات')}` : '⚙️ Alarm Settings';
  document.getElementById('saveSettingsBtn').innerHTML = ur
    ? `💾 ${urduSpan('ترتیبات محفوظ کریں')}` : '💾 Save Settings';

  // Settings labels — 3 languages
  SETTINGS_FIELDS.forEach(f => {
    const label = document.getElementById('label_' + f.key);
    if (label) {
      if (ur) {
        label.textContent = f.ur;
        label.classList.add('urdu-label', 'nastaliq');
      } else {
        label.textContent = f.ru;   // Roman Urdu for EN mode
        label.classList.remove('urdu-label', 'nastaliq');
      }
    }
  });

  // Message cards
  PRAYERS.forEach(p => {
    TYPES.forEach(t => {
      const key = p.key + '_' + t.key;
      const titleCard = document.getElementById('title_' + key);
      const urLabel = document.getElementById('label_ur_' + key);
      const enLabel = document.getElementById('label_en_' + key);
      const previewLabel = document.getElementById('label_preview_' + key);
      const saveBtn = document.getElementById('btn_' + key);

      if (titleCard) {
        titleCard.innerHTML = ur
          ? `🕌 ${urduSpan(p.ur + ' — ' + t.ur, 'ur-name')} <span class="other-part nastaliq">(${p.en} — ${t.en})</span>`
          : `🕌 <span class="en-part">${p.en} — ${t.en}</span> <span class="other-part nastaliq">(${p.ur} — ${t.ur})</span>`;
      }
      if (urLabel) { urLabel.textContent = ur ? 'اردو پیغام:' : 'Urdu message:'; urLabel.classList.toggle('urdu-label', ur); urLabel.classList.toggle('nastaliq', ur); }
      if (enLabel) { enLabel.textContent = ur ? 'انگریزی / رومن اردو → خودکار اردو:' : 'English / Roman Urdu → auto to Urdu:'; enLabel.classList.toggle('urdu-label', ur); enLabel.classList.toggle('nastaliq', ur); }
      if (previewLabel) { previewLabel.textContent = ur ? 'پیش نظارہ:' : 'Preview:'; previewLabel.classList.toggle('urdu-label', ur); previewLabel.classList.toggle('nastaliq', ur); }
      if (saveBtn) saveBtn.innerHTML = ur ? `💾 ${urduSpan('محفوظ کریں')}` : '💾 Save';
    });
  });
}

// ============ TRANSLITERATE ============
async function callTransliterate(text) {
  const proxyUrl = `${API_BASE}/api/transliterate?text=${encodeURIComponent(text)}`;
  const res = await fetch(proxyUrl);
  const proxyData = await res.json();
  if (!proxyData.success) throw new Error('Proxy failed');
  const data = proxyData.data;
  if (data && data[0] === 'SUCCESS' && data[1] && data[1][0] && data[1][0][1] && data[1][0][1].length > 0) {
    return data[1][0][1][0];
  }
  return null;
}

function onEnglishInput(key) {
  const enVal = document.getElementById('en_' + key).value;
  const previewEn = document.getElementById('preview_en_' + key);
  if (previewEn) previewEn.textContent = enVal || '...';
  const hint = document.getElementById('hint_' + key);
  if (autoTransTimers[key]) clearTimeout(autoTransTimers[key]);
  if (!enVal.trim()) { if (hint) hint.classList.remove('show'); return; }
  if (hint) { hint.textContent = '✍️ Typing...'; hint.classList.add('show'); hint.classList.remove('loading', 'error'); }
  autoTransTimers[key] = setTimeout(() => autoTransliterateMsg(key), 1500);
}

async function autoTransliterateMsg(key) {
  const enVal = document.getElementById('en_' + key).value.trim();
  if (!enVal) return;
  const urBox = document.getElementById('ur_' + key);
  const hint = document.getElementById('hint_' + key);
  if (hint) { hint.textContent = '⏳ Translating...'; hint.classList.add('show', 'loading'); hint.classList.remove('error'); }
  try {
    const urduText = await callTransliterate(enVal);
    if (urduText) {
      urBox.value = urduText;
      urBox.classList.add('auto-filled');
      document.getElementById('preview_ur_' + key).textContent = urduText;
      if (hint) { hint.textContent = '✅ Auto-translated'; hint.classList.add('show'); hint.classList.remove('loading', 'error'); }
    } else {
      if (hint) { hint.textContent = '⚠️ Could not translate'; hint.classList.add('show', 'error'); hint.classList.remove('loading'); }
    }
  } catch (e) {
    if (hint) { hint.textContent = '❌ Network error'; hint.classList.add('show', 'error'); hint.classList.remove('loading'); }
  }
}

function onUrduInput(key) {
  const urVal = document.getElementById('ur_' + key).value;
  document.getElementById('preview_ur_' + key).textContent = urVal || '...';
  document.getElementById('ur_' + key).classList.remove('auto-filled');
}

// ============ PRAYER NAMES AUTO-TRANSLATE ============
function onNameEnInput(prayer) {
  const enVal = document.getElementById('name_en_' + prayer).value;
  const hint = document.getElementById('name_hint_' + prayer);
  if (nameAutoTransTimers[prayer]) clearTimeout(nameAutoTransTimers[prayer]);
  if (!enVal.trim()) { if (hint) { hint.textContent = ''; hint.classList.remove('show'); } return; }
  if (hint) { hint.textContent = '✍️'; hint.classList.add('show'); }
  nameAutoTransTimers[prayer] = setTimeout(() => autoTranslateName(prayer), 1500);
}

async function autoTranslateName(prayer) {
  const enVal = document.getElementById('name_en_' + prayer).value.trim();
  if (!enVal) return;
  const urBox = document.getElementById('name_ur_' + prayer);
  const hint = document.getElementById('name_hint_' + prayer);
  if (hint) hint.textContent = '⏳';
  try {
    const urduText = await callTransliterate(enVal);
    if (urduText) {
      urBox.value = urduText;
      urBox.classList.add('auto-filled');
      if (hint) { hint.textContent = '✅'; }
      setTimeout(() => { if (hint) { hint.textContent = ''; hint.classList.remove('show'); } }, 2000);
    } else {
      if (hint) { hint.textContent = '⚠️'; }
    }
  } catch (e) {
    if (hint) { hint.textContent = '❌'; }
  }
}

function onNameUrInput(prayer) {
  document.getElementById('name_ur_' + prayer).classList.remove('auto-filled');
}

// ============ LOAD ============
async function loadAll() {
  await Promise.all([loadMessages(), loadPrayerNames(), loadAlarmSettings()]);
}

async function loadMessages() {
  const loading = document.getElementById('loading');
  const container = document.getElementById('messages-container');
  loading.style.display = 'block';
  loading.textContent = 'Loading messages...';
  container.innerHTML = '';

  try {
    const res = await fetch(API_BASE + '/api/get-prayer-messages');
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Failed');
    messagesData = {};
    data.messages.forEach(m => { messagesData[m.prayer + '_' + m.msg_type] = { ur: m.message_ur || '', en: m.message_en || '' }; });
    renderMessages();
    loading.style.display = 'none';
    updateAllLabels();
  } catch (e) {
    loading.innerHTML = '❌ Error: ' + e.message;
  }
}

function renderMessages() {
  const container = document.getElementById('messages-container');
  container.innerHTML = '';
  PRAYERS.forEach(prayer => {
    TYPES.forEach(type => {
      const key = prayer.key + '_' + type.key;
      const msg = messagesData[key] || { ur: '', en: '' };
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="prayer-title" id="title_${key}"></div>
        <div class="field-group">
          <div class="field-label" id="label_ur_${key}"></div>
          <textarea class="urdu-input nastaliq" id="ur_${key}" placeholder="اردو پیغام..." spellcheck="false">${escapeHtml(msg.ur)}</textarea>
        </div>
        <div class="field-group">
          <div class="field-label" id="label_en_${key}"></div>
          <textarea id="en_${key}" placeholder="Type English — auto converts to Urdu..." oninput="onEnglishInput('${key}')">${escapeHtml(msg.en)}</textarea>
          <div class="auto-hint" id="hint_${key}"></div>
        </div>
        <div class="field-group">
          <div class="field-label" id="label_preview_${key}"></div>
          <div class="preview-label-small">URDU</div>
          <div class="preview-box urdu-preview-box nastaliq" id="preview_ur_${key}">${escapeHtml(msg.ur) || '...'}</div>
          <div class="preview-label-small">ENGLISH</div>
          <div class="preview-box en-preview-box" id="preview_en_${key}">${escapeHtml(msg.en) || '...'}</div>
        </div>
        <button class="save-btn" id="btn_${key}" onclick="saveMessage('${prayer.key}', '${type.key}')"></button>
        <div class="status-msg" id="status_${key}"></div>
      `;
      container.appendChild(card);
      setTimeout(() => {
        const urInput = document.getElementById('ur_' + key);
        if (urInput) urInput.addEventListener('input', () => onUrduInput(key));
      }, 0);
    });
  });
}

async function saveMessage(prayer, msgType) {
  const key = prayer + '_' + msgType;
  const ur = document.getElementById('ur_' + key).value;
  const en = document.getElementById('en_' + key).value;
  const btn = document.getElementById('btn_' + key);
  const status = document.getElementById('status_' + key);
  btn.disabled = true;
  btn.textContent = '⏳...';
  try {
    const res = await fetch(API_BASE + '/api/save-prayer-message', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prayer, msg_type: msgType, message_ur: ur, message_en: en })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    status.textContent = '✅ Saved'; status.className = 'status-msg nastaliq success';
    setTimeout(() => { status.textContent = ''; }, 3000);
  } catch (e) {
    status.textContent = '❌ ' + e.message; status.className = 'status-msg nastaliq error';
  } finally {
    btn.disabled = false; updateAllLabels();
  }
}

// ============ PRAYER NAMES ============
async function loadPrayerNames() {
  const container = document.getElementById('names-container');
  if (!container) return;
  try {
    const res = await fetch(API_BASE + '/api/get-prayer-names');
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    namesData = data.names;
    container.innerHTML = '';
    data.names.forEach(n => {
      const row = document.createElement('div');
      row.className = 'name-row';
      row.innerHTML = `
        <div class="prayer-label">${n.prayer}</div>
        <input class="name-ur nastaliq" id="name_ur_${n.prayer}" value="${escapeHtml(n.name_ur)}" placeholder="اردو نام">
        <input class="name-en" id="name_en_${n.prayer}" value="${escapeHtml(n.name_en)}" placeholder="Type English → auto Urdu">
        <span class="name-hint" id="name_hint_${n.prayer}"></span>
      `;
      container.appendChild(row);
    });
    // Attach listeners after DOM insert
    setTimeout(() => {
      data.names.forEach(n => {
        const enInput = document.getElementById('name_en_' + n.prayer);
        const urInput = document.getElementById('name_ur_' + n.prayer);
        if (enInput) enInput.addEventListener('input', () => onNameEnInput(n.prayer));
        if (urInput) urInput.addEventListener('input', () => onNameUrInput(n.prayer));
      });
    }, 0);
  } catch (e) {
    container.innerHTML = '<div style="color:#c62828;">❌ ' + e.message + '</div>';
  }
}

async function saveAllNames() {
  const status = document.getElementById('names-status');
  status.textContent = '⏳ Saving...';
  status.style.color = '#e65100';
  try {
    for (const p of ['Fajr','Dhuhr','Asr','Maghrib','Isha']) {
      const ur = document.getElementById('name_ur_' + p).value;
      const en = document.getElementById('name_en_' + p).value;
      await fetch(API_BASE + '/api/save-prayer-name', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prayer: p, name_ur: ur, name_en: en })
      });
    }
    status.textContent = currentLang === 'ur' ? '✅ تمام نام محفوظ' : '✅ All names saved';
    status.style.color = '#1b5e20';
    setTimeout(() => { status.textContent = ''; }, 3000);
  } catch (e) {
    status.textContent = '❌ ' + e.message;
    status.style.color = '#c62828';
  }
}

// ============ ALARM SETTINGS ============
async function loadAlarmSettings() {
  const container = document.getElementById('settings-container');
  if (!container) return;
  try {
    const res = await fetch(API_BASE + '/api/get-alarm-settings');
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    settingsData = data.settings || {};
    container.innerHTML = '';
    SETTINGS_FIELDS.forEach(f => {
      const row = document.createElement('div');
      row.className = 'settings-row';
      row.innerHTML = `
        <label id="label_${f.key}"></label>
        <input type="${f.type}" id="setting_${f.key}" value="${escapeHtml(settingsData[f.key] || '')}">
      `;
      container.appendChild(row);
    });
    updateAllLabels();
  } catch (e) {
    container.innerHTML = '<div style="color:#c62828;">❌ ' + e.message + '</div>';
  }
}

async function saveAlarmSettings() {
  const status = document.getElementById('settings-status');
  status.textContent = '⏳ Saving...';
  status.style.color = '#0d47a1';
  const payload = {};
  SETTINGS_FIELDS.forEach(f => { payload[f.key] = document.getElementById('setting_' + f.key).value; });
  try {
    const res = await fetch(API_BASE + '/api/save-alarm-settings', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    status.textContent = currentLang === 'ur' ? '✅ ترتیبات محفوظ' : '✅ Settings saved';
    status.style.color = '#1b5e20';
    setTimeout(() => { status.textContent = ''; }, 3000);
  } catch (e) {
    status.textContent = '❌ ' + e.message;
    status.style.color = '#c62828';
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

window.onload = () => {
  setLang(localStorage.getItem('msg_admin_lang') || 'ur');
  loadAll();
};
</script>
