<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namaz Messages — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f5f0;
    color: #1a1a1a;
    padding: 16px;
    line-height: 1.5;
  }
  .nastaliq {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    direction: rtl;
    line-height: 2.2;
  }
  .header {
    background: #1b5e20;
    color: white;
    padding: 14px;
    border-radius: 12px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .header h1 { font-size: 18px; font-weight: 700; }
  .lang-toggle { display: flex; gap: 8px; }
  .lang-btn {
    padding: 6px 16px;
    border: 2px solid white;
    background: transparent;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
  }
  .lang-btn.active { background: white; color: #1b5e20; }
  .lang-btn.nastaliq {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 15px;
    line-height: 1.9;
    padding: 4px 18px;
    direction: rtl;
  }
  .top-nav { text-align: center; margin-bottom: 14px; }
  .top-nav a {
    color: #1b5e20;
    text-decoration: none;
    font-weight: bold;
    padding: 8px 18px;
    border: 2px solid #1b5e20;
    border-radius: 8px;
    display: inline-block;
    background: white;
    font-size: 13px;
  }
  .card {
    background: white;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    border-left: 4px solid #1b5e20;
  }
  .prayer-title {
    font-size: 15px;
    font-weight: 700;
    color: #1b5e20;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    line-height: 1.8;
  }
  .prayer-title .ur-name {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 17px;
    font-weight: 700;
    line-height: 2.2;
    direction: rtl;
  }
  .prayer-title .en-part {
    font-size: 14px;
    font-weight: 600;
    color: #1b5e20;
  }
  .prayer-title .other-part {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 13px;
    color: #888;
    font-weight: 400;
    line-height: 2;
    direction: rtl;
  }
  .field-group { margin-bottom: 12px; }
  .field-label {
    font-size: 12px;
    color: #555;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .field-label.urdu-label {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 15px;
    line-height: 2.2;
    color: #1b5e20;
    font-weight: 600;
    direction: rtl;
    text-align: right;
    padding-bottom: 4px;
  }
  textarea {
    width: 100%;
    padding: 8px 10px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    min-height: 50px;
  }
  textarea:focus { outline: none; border-color: #1b5e20; }
  textarea.urdu-input {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 17px;
    line-height: 2.2;
    min-height: 70px;
    padding: 10px 14px;
    font-weight: 600;
    direction: rtl;
    text-align: right;
  }
  textarea.urdu-input.auto-filled {
    background: #f1f8e9;
    border-color: #66bb6a;
  }
  .auto-hint {
    font-size: 11px;
    color: #2e7d32;
    margin-top: 4px;
    font-style: italic;
    display: none;
  }
  .auto-hint.show { display: block; }
  .preview-box {
    background: #1b5e20;
    color: white;
    padding: 14px;
    border-radius: 8px;
    margin-top: 6px;
    text-align: center;
    font-size: 15px;
    font-weight: bold;
    min-height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 2;
    word-wrap: break-word;
  }
  .preview-box.urdu-preview-box {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    direction: rtl;
    font-size: 17px;
    line-height: 2.6;
    padding: 18px 12px;
    font-weight: 700;
  }
  .preview-box.en-preview-box {
    background: #2e7d32;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.6;
    padding: 14px 12px;
    margin-top: 4px;
  }
  .preview-label-small {
    font-size: 11px;
    color: #666;
    font-weight: 600;
    margin-top: 6px;
    margin-bottom: 3px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .save-btn {
    background: #1b5e20;
    color: white;
    border: none;
    padding: 11px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    margin-top: 8px;
  }
  .save-btn:disabled { background: #999; }
  .save-btn.saved { background: #2e7d32; }
  .status-msg {
    text-align: center;
    font-size: 13px;
    margin-top: 8px;
    min-height: 18px;
    font-weight: 600;
  }
  .status-msg.nastaliq {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 14px;
    line-height: 2.2;
    direction: rtl;
  }
  .status-msg.success { color: #1b5e20; }
  .status-msg.error { color: #c62828; }
  .loading { text-align: center; padding: 30px; color: #666; font-size: 14px; }
  .refresh-btn {
    background: white;
    color: #1b5e20;
    border: 2px solid #1b5e20;
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .names-section {
    background: white;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
    border-left: 4px solid #ff9800;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .names-section h2 {
    color: #e65100;
    margin-bottom: 12px;
    font-size: 16px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .name-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .name-row .prayer-label {
    flex: 1;
    min-width: 70px;
    font-weight: bold;
    color: #333;
    font-size: 13px;
  }
  .name-row input.name-ur {
    flex: 2;
    min-width: 110px;
    padding: 8px 10px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 16px;
    direction: rtl;
    text-align: right;
    line-height: 2;
  }
  .name-row input.name-en {
    flex: 2;
    min-width: 110px;
    padding: 8px 10px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
  }
  .names-save-btn {
    background: #e65100;
    color: white;
    border: none;
    padding: 11px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    margin-top: 10px;
  }
  .names-status {
    text-align: center;
    font-size: 13px;
    margin-top: 8px;
    min-height: 18px;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="header">
  <h1 id="pageTitle">📿 Namaz Messages</h1>
  <div class="lang-toggle">
    <button class="lang-btn nastaliq active" id="btn-ur" onclick="setLang('ur')">اردو</button>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
  </div>
</div>

<div class="top-nav">
  <a href="/admin.html" id="adminLink">← Admin Panel</a>
</div>

<div style="text-align:center;">
  <button class="refresh-btn" onclick="loadMessages(); loadPrayerNames();" id="reloadBtn">🔄 Reload</button>
</div>

<div class="names-section">
  <h2 id="namesHeading">
    🕌 Prayer Names / <span class="nastaliq" style="font-size:17px; color:#e65100;">نام تبدیل کریں</span>
  </h2>
  <div id="names-container"></div>
  <button class="names-save-btn" onclick="saveAllNames()" id="saveNamesBtn">
    💾 Save All Names
  </button>
  <div class="names-status" id="names-status"></div>
</div>

<div id="loading" class="loading">Loading messages...</div>
<div id="messages-container"></div>

<script>
const API_BASE = 'https://zahidiya-mysore.pages.dev';

const PRAYERS = [
  { key: 'Fajr',    ur: 'فجر',    en: 'Fajr' },
  { key: 'Dhuhr',   ur: 'ظہر',    en: 'Dhuhr' },
  { key: 'Asr',     ur: 'عصر',    en: 'Asr' },
  { key: 'Maghrib', ur: 'مغرب',   en: 'Maghrib' },
  { key: 'Isha',    ur: 'عشاء',   en: 'Isha' },
];

const TYPES = [
  { key: 'start', ur: 'شروع',  en: 'Start' },
  { key: 'end',   ur: 'ختم',   en: 'End' },
];

let currentLang = 'ur';
let messagesData = {};
let autoTransTimers = {};   // har field ka apna timer

// ============ LANGUAGE ============
function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('msg_admin_lang', lang);
  document.getElementById('btn-ur').classList.toggle('active', lang === 'ur');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  updateAllLabels();
}

function updateAllLabels() {
  const ur = currentLang === 'ur';

  // Page title
  document.getElementById('pageTitle').textContent = ur ? '📿 نماز کے پیغامات' : '📿 Namaz Messages';
  document.getElementById('pageTitle').className = ur ? 'nastaliq' : '';

  // Reload button
  document.getElementById('reloadBtn').textContent = ur ? '🔄 دوبارہ لوڈ کریں' : '🔄 Reload';

  // Names section heading
  document.getElementById('namesHeading').innerHTML = ur
    ? '🕌 نماز کے نام / <span class="nastaliq" style="font-size:17px;">تبدیل کریں</span>'
    : '🕌 Prayer Names (Edit)';

  // Save names button
  document.getElementById('saveNamesBtn').textContent = ur
    ? '💾 تمام نام محفوظ کریں'
    : '💾 Save All Names';

  // Message cards
  PRAYERS.forEach(p => {
    TYPES.forEach(t => {
      const key = p.key + '_' + t.key;
      const titleCard = document.getElementById('title_' + key);
      const urLabel = document.getElementById('label_ur_' + key);
      const enLabel = document.getElementById('label_en_' + key);
      const previewLabel = document.getElementById('label_preview_' + key);
      const saveBtn = document.getElementById('btn_' + key);

      if (titleCard) {
        titleCard.innerHTML = ur
          ? `🕌 <span class="ur-name">${p.ur} — ${t.ur}</span> <span class="other-part">(${p.en} — ${t.en})</span>`
          : `🕌 <span class="en-part">${p.en} — ${t.en}</span> <span class="other-part">(${p.ur} — ${t.ur})</span>`;
      }
      if (urLabel) urLabel.textContent = ur ? 'اردو پیغام:' : 'Urdu message:';
      if (enLabel) {
        enLabel.textContent = ur ? 'انگریزی / رومن اردو (خودکار اردو):' : 'English / Roman Urdu (auto to Urdu):';
        enLabel.classList.toggle('urdu-label', ur);
      }
      if (previewLabel) {
        previewLabel.textContent = ur ? 'پیش نظارہ:' : 'Preview:';
        previewLabel.classList.toggle('urdu-label', ur);
      }
      if (saveBtn) saveBtn.textContent = ur ? '💾 محفوظ کریں' : '💾 Save';
    });
  });
}

// ============ AUTO TRANSLITERATE ============
function onEnglishInput(key) {
  const enVal = document.getElementById('en_' + key).value;
  const previewEn = document.getElementById('preview_en_' + key);
  if (previewEn) previewEn.textContent = enVal || '...';

  // Debounce: 1.2 sec ke baad transliterate karo
  if (autoTransTimers[key]) clearTimeout(autoTransTimers[key]);
  if (!enVal.trim()) return;

  autoTransTimers[key] = setTimeout(() => autoTransliterate(key), 1200);
}

async function autoTransliterate(key) {
  const enVal = document.getElementById('en_' + key).value.trim();
  if (!enVal) return;

  const urBox = document.getElementById('ur_' + key);
  const hint = document.getElementById('hint_' + key);

  if (hint) {
    hint.textContent = '⏳ Translating...';
    hint.classList.add('show');
  }

  try {
    const url = `https://inputtools.google.com/request?text=${encodeURIComponent(enVal)}&itc=ur-t-i0-und&num=1&cp=0&cs=1&ie=utf-8&oe=utf-8`;
    const res = await fetch(url);
    const data = await res.json();

    if (data && data[0] === 'SUCCESS' && data[1][0][1].length > 0) {
      const urduText = data[1][0][1][0];
      urBox.value = urduText;
      urBox.classList.add('auto-filled');
      document.getElementById('preview_ur_' + key).textContent = urduText;
      if (hint) {
        hint.textContent = '✅ Auto-translated. Edit if needed.';
        hint.classList.add('show');
      }
    } else {
      if (hint) {
        hint.textContent = '⚠️ Auto-translate failed, please type manually.';
        hint.classList.add('show');
      }
    }
  } catch (e) {
    if (hint) {
      hint.textContent = '❌ Network error.';
      hint.classList.add('show');
    }
  }
}

// Agar user manually Urdu box mein type kare, auto-filled marker hata do
function onUrduInput(key) {
  const urVal = document.getElementById('ur_' + key).value;
  document.getElementById('preview_ur_' + key).textContent = urVal || '...';
  document.getElementById('ur_' + key).classList.remove('auto-filled');
}

// ============ LOAD MESSAGES ============
async function loadMessages() {
  const loading = document.getElementById('loading');
  const container = document.getElementById('messages-container');
  loading.style.display = 'block';
  loading.textContent = 'Loading messages...';
  container.innerHTML = '';

  try {
    const res = await fetch(API_BASE + '/api/get-prayer-messages');
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Failed');

    messagesData = {};
    data.messages.forEach(m => {
      messagesData[m.prayer + '_' + m.msg_type] = {
        ur: m.message_ur || '',
        en: m.message_en || ''
      };
    });
    renderMessages();
    loading.style.display = 'none';
    updateAllLabels();
  } catch (e) {
    loading.innerHTML = '❌ Error: ' + e.message;
  }
}

function renderMessages() {
  const container = document.getElementById('messages-container');
  container.innerHTML = '';

  PRAYERS.forEach(prayer => {
    TYPES.forEach(type => {
      const key = prayer.key + '_' + type.key;
      const msg = messagesData[key] || { ur: '', en: '' };
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="prayer-title" id="title_${key}">
          🕌 <span class="ur-name">${prayer.ur} — ${type.ur}</span> <span class="other-part">(${prayer.en} — ${type.en})</span>
        </div>
        <div class="field-group">
          <div class="field-label urdu-label" id="label_ur_${key}">اردو پیغام:</div>
          <textarea class="urdu-input" id="ur_${key}" placeholder="یہاں اردو پیغام..." spellcheck="false">${escapeHtml(msg.ur)}</textarea>
        </div>
        <div class="field-group">
          <div class="field-label urdu-label" id="label_en_${key}">انگریزی / رومن اردو (خودکار اردو):</div>
          <textarea id="en_${key}" placeholder="Type in English / Roman Urdu — auto converts to Urdu..." oninput="onEnglishInput('${key}')">${escapeHtml(msg.en)}</textarea>
          <div class="auto-hint" id="hint_${key}"></div>
        </div>
        <div class="field-group">
          <div class="field-label urdu-label" id="label_preview_${key}">پیش نظارہ:</div>
          <div class="preview-label-small">URDU PREVIEW</div>
          <div class="preview-box urdu-preview-box" id="preview_ur_${key}">${escapeHtml(msg.ur) || '...'}</div>
          <div class="preview-label-small">ENGLISH PREVIEW</div>
          <div class="preview-box en-preview-box" id="preview_en_${key}">${escapeHtml(msg.en) || '...'}</div>
        </div>
        <button class="save-btn" id="btn_${key}" onclick="saveMessage('${prayer.key}', '${type.key}')">💾 Save</button>
        <div class="status-msg nastaliq" id="status_${key}"></div>
      `;
      container.appendChild(card);

      setTimeout(() => {
        const urInput = document.getElementById('ur_' + key);
        if (urInput) {
          urInput.addEventListener('input', () => onUrduInput(key));
        }
      }, 0);
    });
  });
}

// ============ SAVE MESSAGE ============
async function saveMessage(prayer, msgType) {
  const key = prayer + '_' + msgType;
  const ur = document.getElementById('ur_' + key).value;
  const en = document.getElementById('en_' + key).value;
  const btn = document.getElementById('btn_' + key);
  const status = document.getElementById('status_' + key);

  btn.disabled = true;
  btn.textContent = '⏳ Saving...';
  status.textContent = '';
  status.className = 'status-msg nastaliq';

  try {
    const res = await fetch(API_BASE + '/api/save-prayer-message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prayer, msg_type: msgType, message_ur: ur, message_en: en })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Save failed');

    status.textContent = currentLang === 'ur' ? '✅ کامیابی سے محفوظ' : '✅ Saved successfully';
    status.className = 'status-msg nastaliq success';
    setTimeout(() => { status.textContent = ''; }, 3000);
  } catch (e) {
    status.textContent = '❌ ' + e.message;
    status.className = 'status-msg nastaliq error';
  } finally {
    btn.disabled = false;
    btn.textContent = currentLang === 'ur' ? '💾 محفوظ کریں' : '💾 Save';
  }
}

// ============ PRAYER NAMES ============
async function loadPrayerNames() {
  const container = document.getElementById('names-container');
  if (!container) return;

  try {
    const res = await fetch(API_BASE + '/api/get-prayer-names');
    const data = await res.json();
    if (!data.success) throw new Error(data.error);

    container.innerHTML = '';
    data.names.forEach(n => {
      const row = document.createElement('div');
      row.className = 'name-row';
      row.innerHTML = `
        <div class="prayer-label">${n.prayer}</div>
        <input class="name-ur" id="name_ur_${n.prayer}" value="${escapeHtml(n.name_ur)}" placeholder="اردو نام">
        <input class="name-en" id="name_en_${n.prayer}" value="${escapeHtml(n.name_en)}" placeholder="English name">
      `;
      container.appendChild(row);
    });
  } catch (e) {
    container.innerHTML = '<div style="color:#c62828;">❌ ' + e.message + '</div>';
  }
}

async function saveAllNames() {
  const status = document.getElementById('names-status');
  const prayers = ['Fajr','Dhuhr','Asr','Maghrib','Isha'];
  status.textContent = '⏳ Saving...';
  status.style.color = '#e65100';

  try {
    for (const p of prayers) {
      const ur = document.getElementById('name_ur_' + p).value;
      const en = document.getElementById('name_en_' + p).value;
      await fetch(API_BASE + '/api/save-prayer-name', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prayer: p, name_ur: ur, name_en: en })
      });
    }
    status.textContent = currentLang === 'ur' ? '✅ تمام نام محفوظ' : '✅ All names saved';
    status.style.color = '#1b5e20';
    setTimeout(() => { status.textContent = ''; }, 3000);
  } catch (e) {
    status.textContent = '❌ ' + e.message;
    status.style.color = '#c62828';
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

window.onload = () => {
  setLang(localStorage.getItem('msg_admin_lang') || 'ur');
  loadMessages();
  loadPrayerNames();
};
</script>

</body>
</html>
