<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namaz Messages — Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f5f0;
    color: #1a1a1a;
    padding: 16px;
    line-height: 1.5;
  }
  .header {
    background: #1b5e20;
    color: white;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .header h1 { font-size: 20px; }
  .lang-toggle { display: flex; gap: 8px; }
  .lang-btn {
    padding: 8px 16px;
    border: 2px solid white;
    background: transparent;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
  }
  .lang-btn.active { background: white; color: #1b5e20; }
  .card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    border-left: 4px solid #1b5e20;
  }
  .prayer-title {
    font-size: 17px;
    font-weight: bold;
    color: #1b5e20;
    margin-bottom: 12px;
  }
  .field-group { margin-bottom: 14px; }
  .field-label {
    font-size: 13px;
    color: #555;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .field-label.urdu {
    font-size: 15px;
    direction: rtl;
    text-align: right;
  }
  textarea {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
    min-height: 55px;
  }
  textarea:focus { outline: none; border-color: #1b5e20; }
  textarea.urdu-input {
    font-size: 17px;
    direction: rtl;
    text-align: right;
    line-height: 2;
  }
  .preview-box {
    background: #1b5e20;
    color: white;
    padding: 16px;
    border-radius: 8px;
    margin-top: 8px;
    text-align: center;
    font-size: 17px;
    font-weight: bold;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.8;
  }
  .save-btn {
    background: #1b5e20;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    margin-top: 8px;
  }
  .save-btn:hover { background: #2e7d32; }
  .save-btn:disabled { background: #999; cursor: not-allowed; }
  .save-btn.saved { background: #2e7d32; }
  .status-msg {
    text-align: center;
    font-size: 13px;
    margin-top: 8px;
    min-height: 18px;
  }
  .status-msg.success { color: #1b5e20; }
  .status-msg.error { color: #c62828; }
  .loading { text-align: center; padding: 40px; color: #666; }
  .refresh-btn {
    background: white;
    color: #1b5e20;
    border: 2px solid #1b5e20;
    padding: 8px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<div class="header">
  <h1 id="pageTitle">📿 Namaz Messages</h1>
  <div class="lang-toggle">
    <button class="lang-btn active" id="btn-ur" onclick="setLang('ur')">اردو</button>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
  </div>
</div>

<div style="text-align:center;">
  <button class="refresh-btn" onclick="loadMessages()">🔄 Reload</button>
</div>

<div id="loading" class="loading">Loading messages...</div>
<div id="messages-container"></div>

<script>
const API_BASE = 'https://zahidiya-mysore.pages.dev';
const PRAYERS = [
  { key: 'Fajr',    en: 'Fajr',    ur: 'فجر' },
  { key: 'Dhuhr',   en: 'Dhuhr',   ur: 'ظہر' },
  { key: 'Asr',     en: 'Asr',     ur: 'عصر' },
  { key: 'Maghrib', en: 'Maghrib', ur: 'مغرب' },
  { key: 'Isha',    en: 'Isha',    ur: 'عشاء' },
];
const TYPES = [
  { key: 'start', en: 'Start', ur: 'شروع' },
  { key: 'end',   en: 'End',   ur: 'ختم' },
];

let currentLang = 'ur';
let messagesData = {};

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('msg_admin_lang', lang);
  document.getElementById('btn-ur').classList.toggle('active', lang === 'ur');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('pageTitle').textContent = lang === 'ur' ? '📿 نماز کے پیغامات' : '📿 Namaz Messages';
}

async function loadMessages() {
  const loading = document.getElementById('loading');
  const container = document.getElementById('messages-container');
  loading.style.display = 'block';
  loading.textContent = 'Loading messages...';
  container.innerHTML = '';

  try {
    const res = await fetch(API_BASE + '/api/get-prayer-messages');
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Failed to load');

    messagesData = {};
    data.messages.forEach(m => {
      messagesData[m.prayer + '_' + m.msg_type] = {
        ur: m.message_ur || '',
        en: m.message_en || ''
      };
    });
    renderMessages();
    loading.style.display = 'none';
  } catch (e) {
    loading.innerHTML = '❌ Error: ' + e.message;
  }
}

function renderMessages() {
  const container = document.getElementById('messages-container');
  container.innerHTML = '';

  PRAYERS.forEach(prayer => {
    TYPES.forEach(type => {
      const key = prayer.key + '_' + type.key;
      const msg = messagesData[key] || { ur: '', en: '' };
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="prayer-title">
          🕌 ${prayer.en} — ${type.en} <span style="color:#666; font-size:14px;">(${prayer.ur} — ${type.ur})</span>
        </div>
        <div class="field-group">
          <div class="field-label urdu">اردو پیغام:</div>
          <textarea class="urdu-input" id="ur_${key}" placeholder="یہاں اردو پیغام لکھیں...">${escapeHtml(msg.ur)}</textarea>
        </div>
        <div class="field-group">
          <div class="field-label">English / Roman Urdu:</div>
          <textarea id="en_${key}" placeholder="Enter English message...">${escapeHtml(msg.en)}</textarea>
        </div>
        <div class="field-group">
          <div class="field-label">Preview:</div>
          <div class="preview-box" id="preview_${key}">${escapeHtml(msg.ur) || '...'}</div>
        </div>
        <button class="save-btn" id="btn_${key}" onclick="saveMessage('${prayer.key}', '${type.key}')">💾 Save</button>
        <div class="status-msg" id="status_${key}"></div>
      `;
      container.appendChild(card);

      setTimeout(() => {
        const urInput = document.getElementById('ur_' + key);
        if (urInput) {
          urInput.addEventListener('input', e => {
            document.getElementById('preview_' + key).textContent = e.target.value || '...';
          });
        }
      }, 0);
    });
  });
}

async function saveMessage(prayer, msgType) {
  const key = prayer + '_' + msgType;
  const ur = document.getElementById('ur_' + key).value;
  const en = document.getElementById('en_' + key).value;
  const btn = document.getElementById('btn_' + key);
  const status = document.getElementById('status_' + key);

  btn.disabled = true;
  btn.textContent = '⏳ Saving...';
  status.textContent = '';
  status.className = 'status-msg';

  try {
    const res = await fetch(API_BASE + '/api/save-prayer-message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prayer: prayer,
        msg_type: msgType,
        message_ur: ur,
        message_en: en
      })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Save failed');

    status.textContent = '✅ Saved successfully';
    status.className = 'status-msg success';
    btn.classList.add('saved');
    setTimeout(() => {
      status.textContent = '';
      btn.classList.remove('saved');
    }, 3000);
  } catch (e) {
    status.textContent = '❌ ' + e.message;
    status.className = 'status-msg error';
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 Save';
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

window.onload = () => {
  const savedLang = localStorage.getItem('msg_admin_lang') || 'ur';
  setLang(savedLang);
  loadMessages();
};
</script>

</body>
</html>
