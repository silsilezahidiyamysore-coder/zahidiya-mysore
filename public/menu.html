<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .nastaliq {
    font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif !important;
    direction: rtl;
    line-height: 2.2;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f5f0;
    color: #1a1a1a;
    padding: 16px;
  }

  .header {
    background: #1b5e20;
    color: white;
    padding: 14px;
    border-radius: 12px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .header h1 { font-size: 20px; font-weight: 700; }

  .lang-toggle { display: flex; gap: 8px; }
  .lang-btn {
    padding: 6px 16px;
    border: 2px solid white;
    background: transparent;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
  }
  .lang-btn.active { background: white; color: #1b5e20; }

  .top-nav {
    text-align: center;
    margin-bottom: 14px;
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .top-nav a {
    color: #1b5e20;
    text-decoration: none;
    font-weight: bold;
    padding: 8px 18px;
    border: 2px solid #1b5e20;
    border-radius: 8px;
    background: white;
    font-size: 13px;
  }

  .add-btn {
    background: #1b5e20;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    margin-bottom: 14px;
  }

  .items-list { display: grid; gap: 12px; }

  .menu-card {
    background: white;
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    border-left: 5px solid #1b5e20;
  }
  .menu-card.inactive {
    opacity: 0.6;
    border-left-color: #999;
  }

  /* Top row: badges */
  .menu-badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .menu-badge {
    display: inline-block;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 10px;
    font-weight: 600;
    font-family: 'Noto Nastaliq Urdu', serif !important;
    direction: rtl;
    line-height: 2;
  }
  .badge-active { background: #e8f5e9; color: #1b5e20; }
  .badge-inactive { background: #ffebee; color: #c62828; }
  .badge-type { background: #e3f2fd; color: #0d47a1; }
  .badge-order { background: #f0f0f0; color: #666; font-family: inherit !important; direction: ltr; }

  /* Middle: icon + names */
  .menu-main {
    display: flex;
    gap: 14px;
    align-items: center;
    margin-bottom: 12px;
  }

  .menu-icon {
    font-size: 42px;
    min-width: 60px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f9f5;
    border-radius: 10px;
    flex-shrink: 0;
  }

  .menu-labels {
    flex: 1;
    min-width: 0;
  }

  .menu-label-ur {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 24px;
    font-weight: 700;
    color: #1b5e20;
    direction: rtl;
    text-align: right;
    line-height: 2.4;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .menu-label-en {
    font-size: 14px;
    font-weight: 600;
    color: #666;
    margin-top: 4px;
    text-align: right;
  }

  .menu-url {
    font-size: 11px;
    color: #999;
    margin-top: 4px;
    text-align: right;
    word-break: break-all;
  }

  /* Bottom: buttons side by side */
  .menu-actions {
    display: flex;
    gap: 8px;
    padding-top: 10px;
    border-top: 1px solid #eee;
  }

  .action-btn {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    font-size: 15px;
    font-family: 'Noto Nastaliq Urdu', serif !important;
    direction: rtl;
    line-height: 2;
    transition: opacity 0.2s;
  }
  .action-btn:hover { opacity: 0.85; }
  .btn-edit { background: #ff9800; color: white; }
  .btn-delete { background: #f44336; color: white; }

  /* Modal */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: white;
    border-radius: 14px;
    padding: 20px;
    max-width: 500px;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
  }
  .modal h2 {
    font-size: 20px;
    color: #1b5e20;
    margin-bottom: 16px;
    text-align: center;
  }

  .field { margin-bottom: 14px; }

  .field label {
    display: block;
    font-size: 15px;
    font-weight: 600;
    color: #1b5e20;
    margin-bottom: 6px;
    text-align: right;
  }

  .field input[type="text"],
  .field input[type="number"],
  .field select {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    background: white;
    font-family: inherit;
  }

  .field input.urdu-input {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 20px;
    line-height: 2.6;
    text-align: right;
    direction: rtl;
    padding: 8px 12px;
  }
  .field input.urdu-input.auto-filled {
    background: #f1f8e9;
    border-color: #66bb6a;
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: #1b5e20;
  }

  .auto-hint {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 14px;
    line-height: 2;
    direction: rtl;
    text-align: right;
    margin-top: 4px;
    padding: 4px 10px;
    border-radius: 6px;
    display: none;
  }
  .auto-hint.show { display: block; }
  .auto-hint.loading { background: #fff3e0; color: #e65100; }
  .auto-hint.success { background: #e8f5e9; color: #2e7d32; }
  .auto-hint.error { background: #ffebee; color: #c62828; }

  .field-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .field-row > * { flex: 1; min-width: 120px; }

  .emoji-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .emoji-btn {
    font-size: 22px;
    padding: 6px 10px;
    background: #f5f5f5;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    cursor: pointer;
  }
  .emoji-btn:hover { background: #e8f5e9; border-color: #1b5e20; }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background: #f9f9f9;
    border-radius: 8px;
  }
  .checkbox-row input[type="checkbox"] {
    width: 22px;
    height: 22px;
    cursor: pointer;
  }
  .checkbox-row label {
    margin: 0;
    cursor: pointer;
    font-size: 16px;
    font-family: 'Noto Nastaliq Urdu', serif !important;
    direction: rtl;
    line-height: 2;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .modal-btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    font-family: 'Noto Nastaliq Urdu', serif !important;
    direction: rtl;
    line-height: 2;
  }
  .btn-cancel { background: #e0e0e0; color: #333; }
  .btn-save { background: #1b5e20; color: white; }
  .btn-save:disabled { background: #999; }

  .empty-state {
    text-align: center;
    padding: 40px;
    color: #888;
    background: white;
    border-radius: 12px;
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 18px;
    direction: rtl;
    line-height: 2.4;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #323232;
    color: white;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 200;
    font-family: 'Noto Nastaliq Urdu', serif !important;
    direction: rtl;
    font-size: 16px;
    line-height: 2;
    max-width: 90%;
  }
  .toast.show { opacity: 1; }
  .toast.success { background: #1b5e20; }
  .toast.error { background: #c62828; }
</style>
</head>
<body>

<div class="header">
  <h1 id="pageTitle" class="nastaliq">🎛️ مینو مینیجر</h1>
  <div class="lang-toggle">
    <button class="lang-btn nastaliq active" id="btn-ur" onclick="setLang('ur')">اردو</button>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
  </div>
</div>

<div class="top-nav">
  <a href="/admin.html">← Admin Panel</a>
  <a href="/messages.html">📿 Namaz Messages</a>
</div>

<button class="add-btn nastaliq" id="addBtn" onclick="openForm()">➕ نیا مینو آئٹم شامل کریں</button>

<div id="items-container" class="items-list"></div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeForm()">
  <div class="modal">
    <h2 id="modalTitle" class="nastaliq">نیا مینو آئٹم</h2>

    <div class="field">
      <label id="lbl_en" class="nastaliq">انگریزی نام (رومن اردو — یہاں لکھیں)</label>
      <input type="text" id="f_label_en" placeholder="Sawal-Jawab" oninput="onEnglishInput()">
      <div class="auto-hint" id="name_hint"></div>
    </div>

    <div class="field">
      <label id="lbl_ur" class="nastaliq">اردو نام (خودکار)</label>
      <input type="text" id="f_label_ur" class="urdu-input" placeholder="سوال و جواب" oninput="onUrduManual()">
    </div>

    <div class="field">
      <label id="lbl_icon" class="nastaliq">آئیکن</label>
      <input type="text" id="f_icon" placeholder="📖" maxlength="4" style="font-size:24px; text-align:center;">
      <div class="emoji-row">
        <button class="emoji-btn" onclick="setEmoji('📖')">📖</button>
        <button class="emoji-btn" onclick="setEmoji('📚')">📚</button>
        <button class="emoji-btn" onclick="setEmoji('❓')">❓</button>
        <button class="emoji-btn" onclick="setEmoji('🎥')">🎥</button>
        <button class="emoji-btn" onclick="setEmoji('💬')">💬</button>
        <button class="emoji-btn" onclick="setEmoji('🕌')">🕌</button>
        <button class="emoji-btn" onclick="setEmoji('📞')">📞</button>
        <button class="emoji-btn" onclick="setEmoji('🔗')">🔗</button>
        <button class="emoji-btn" onclick="setEmoji('📌')">📌</button>
        <button class="emoji-btn" onclick="setEmoji('🌐')">🌐</button>
        <button class="emoji-btn" onclick="setEmoji('📢')">📢</button>
        <button class="emoji-btn" onclick="setEmoji('🎧')">🎧</button>
      </div>
    </div>

    <div class="field">
      <label id="lbl_url" class="nastaliq">لنک</label>
      <input type="text" id="f_url" placeholder="/quran  یا  https://...">
    </div>

    <div class="field-row">
      <div class="field">
        <label id="lbl_order" class="nastaliq">ترتیب</label>
        <input type="number" id="f_order" value="0" min="0">
      </div>
      <div class="field">
        <label id="lbl_open_in" class="nastaliq">کہاں کھلے</label>
        <select id="f_open_in">
          <option value="webview">ایپ میں</option>
          <option value="external">باہر</option>
        </select>
      </div>
    </div>

    <div class="field">
      <div class="checkbox-row">
        <input type="checkbox" id="f_active" checked>
        <label for="f_active" id="lbl_active">فعال (ایپ میں دکھائیں)</label>
      </div>
    </div>

    <div class="modal-actions">
      <button class="modal-btn btn-cancel" onclick="closeForm()" id="cancelBtn">منسوخ کریں</button>
      <button class="modal-btn btn-save" onclick="saveItem()" id="saveBtn">💾 محفوظ کریں</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = 'https://zahidiya-mysore.pages.dev';
let items = [];
let editingId = null;
let currentLang = 'ur';
let autoTransTimer = null;

const STR = {
  en: {
    title: '🎛️ Menu Manager',
    addBtn: '➕ Add New Menu Item',
    modalAdd: 'Add Menu Item',
    modalEdit: 'Edit Menu Item',
    lblUr: 'Urdu Label (auto-translated)',
    lblEn: 'English / Roman Urdu (type here)',
    lblIcon: 'Icon (Emoji)',
    lblUrl: 'URL / Link',
    lblOrder: 'Order',
    lblOpenIn: 'Open In',
    lblActive: 'Active (Show in app)',
    optInApp: 'In App',
    optExternal: 'External',
    cancel: 'Cancel',
    save: '💾 Save',
    edit: 'Edit',
    delete: 'Delete',
    confirmDelete: 'Delete this item?',
    active: 'Active',
    inactive: 'Inactive',
    inApp: 'In App',
    external: 'External',
    empty: 'No menu items yet. Click "Add New Menu Item" to start.',
    saved: '✅ Saved successfully',
    deleted: '✅ Deleted',
    saveFail: '❌ Save failed',
    deleteFail: '❌ Delete failed',
    urlRequired: '⚠️ URL is required',
    typing: '✍️ Typing...',
    translating: '⏳ Translating...',
    translated: '✅ Auto-translated',
    transFail: '⚠️ Could not translate — please type manually',
    netErr: '❌ Network error',
  },
  ur: {
    title: '🎛️ مینو مینیجر',
    addBtn: '➕ نیا مینو آئٹم شامل کریں',
    modalAdd: 'نیا مینو آئٹم',
    modalEdit: 'مینو میں تبدیلی',
    lblUr: 'اردو نام (خودکار)',
    lblEn: 'انگریزی / رومن اردو (یہاں لکھیں)',
    lblIcon: 'آئیکن',
    lblUrl: 'لنک',
    lblOrder: 'ترتیب',
    lblOpenIn: 'کہاں کھلے',
    lblActive: 'فعال (ایپ میں دکھائیں)',
    optInApp: 'ایپ میں',
    optExternal: 'باہر',
    cancel: 'منسوخ کریں',
    save: '💾 محفوظ کریں',
    edit: 'تبدیلی',
    delete: 'حذف',
    confirmDelete: 'یہ آئٹم حذف کریں؟',
    active: 'فعال',
    inactive: 'غیر فعال',
    inApp: 'ایپ میں',
    external: 'باہر',
    empty: 'کوئی مینو آئٹم نہیں۔ "نیا شامل کریں" پر کلک کریں۔',
    saved: '✅ محفوظ ہو گیا',
    deleted: '✅ حذف ہو گیا',
    saveFail: '❌ محفوظ نہیں ہوا',
    deleteFail: '❌ حذف نہیں ہوا',
    urlRequired: '⚠️ لنک ضروری ہے',
    typing: '✍️ ٹائپ کر رہے ہیں...',
    translating: '⏳ اردو میں ہو رہا ہے...',
    translated: '✅ خودکار اردو ہو گیا',
    transFail: '⚠️ اردو نہیں ہو سکا — خود لکھیں',
    netErr: '❌ نیٹ ورک مسئلہ',
  }
};

function t(key) { return STR[currentLang][key] || key; }

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('menu_admin_lang', lang);
  document.getElementById('btn-ur').classList.toggle('active', lang === 'ur');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  updateLabels();
  renderItems();
}

function updateLabels() {
  const ur = currentLang === 'ur';

  document.getElementById('pageTitle').textContent = t('title');
  document.getElementById('addBtn').textContent = t('addBtn');

  document.getElementById('lbl_ur').textContent = t('lblUr');
  document.getElementById('lbl_en').textContent = t('lblEn');
  document.getElementById('lbl_icon').textContent = t('lblIcon');
  document.getElementById('lbl_url').textContent = t('lblUrl');
  document.getElementById('lbl_order').textContent = t('lblOrder');
  document.getElementById('lbl_open_in').textContent = t('lblOpenIn');
  document.getElementById('lbl_active').textContent = t('lblActive');

  document.getElementById('f_open_in').options[0].text = t('optInApp');
  document.getElementById('f_open_in').options[1].text = t('optExternal');

  document.getElementById('cancelBtn').textContent = t('cancel');
  document.getElementById('saveBtn').textContent = t('save');
  document.getElementById('modalTitle').textContent =
    editingId ? t('modalEdit') : t('modalAdd');

  // Nastaliq on/off toggle for Urdu mode
  ['pageTitle', 'addBtn', 'lbl_ur', 'lbl_en', 'lbl_icon', 'lbl_url',
   'lbl_order', 'lbl_open_in', 'lbl_active', 'modalTitle', 'cancelBtn', 'saveBtn']
    .forEach(id => {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('nastaliq', ur);
    });
}

// ========== AUTO TRANSLITERATE ==========
function onEnglishInput() {
  const enVal = document.getElementById('f_label_en').value.trim();
  const hint = document.getElementById('name_hint');

  if (autoTransTimer) clearTimeout(autoTransTimer);

  if (!enVal) {
    hint.classList.remove('show');
    return;
  }

  hint.textContent = t('typing');
  hint.className = 'auto-hint show loading';

  autoTransTimer = setTimeout(() => autoTransliterate(enVal), 1500);
}

async function autoTransliterate(text) {
  const urInput = document.getElementById('f_label_ur');
  const hint = document.getElementById('name_hint');

  hint.textContent = t('translating');
  hint.className = 'auto-hint show loading';

  try {
    const url = `${API_BASE}/api/transliterate?text=${encodeURIComponent(text)}`;
    const res = await fetch(url);
    const proxyData = await res.json();

    if (!proxyData.success) throw new Error('Proxy fail');
    const data = proxyData.data;

    if (data && data[0] === 'SUCCESS' && data[1] && data[1][0] &&
        data[1][0][1] && data[1][0][1].length > 0) {
      const urduText = data[1][0][1][0];
      urInput.value = urduText;
      urInput.classList.add('auto-filled');
      hint.textContent = t('translated');
      hint.className = 'auto-hint show success';
      setTimeout(() => hint.classList.remove('show'), 2500);
    } else {
      hint.textContent = t('transFail');
      hint.className = 'auto-hint show error';
    }
  } catch (e) {
    hint.textContent = t('netErr');
    hint.className = 'auto-hint show error';
  }
}

function onUrduManual() {
  document.getElementById('f_label_ur').classList.remove('auto-filled');
}

// ========== LOAD & RENDER ==========
async function loadItems() {
  try {
    const res = await fetch(API_BASE + '/api/get-menu-items');
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    items = data.items || [];
    renderItems();
  } catch (e) {
    document.getElementById('items-container').innerHTML =
      '<div class="empty-state">❌ ' + e.message + '</div>';
  }
}

function renderItems() {
  const container = document.getElementById('items-container');
  if (!items.length) {
    container.innerHTML = '<div class="empty-state">' + t('empty') + '</div>';
    return;
  }
  container.innerHTML = '';

  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'menu-card' + (item.is_active ? '' : ' inactive');

    const typeBadge = item.open_in === 'external' ? t('external') : t('inApp');
    const activeBadge = item.is_active ? t('active') : t('inactive');

    card.innerHTML = `
      <div class="menu-badges">
        <span class="menu-badge ${item.is_active ? 'badge-active' : 'badge-inactive'}">${activeBadge}</span>
        <span class="menu-badge badge-type">${typeBadge}</span>
        <span class="menu-badge badge-order">#${item.sort_order}</span>
      </div>

      <div class="menu-main">
        <div class="menu-icon">${item.icon || '📌'}</div>
        <div class="menu-labels">
          <div class="menu-label-ur">${escapeHtml(item.label_ur || '—')}</div>
          <div class="menu-label-en">${escapeHtml(item.label_en || '')}</div>
          <div class="menu-url">🔗 ${escapeHtml(item.url || '')}</div>
        </div>
      </div>

      <div class="menu-actions">
        <button class="action-btn btn-edit" onclick="editItem(${item.id})">✏️ ${t('edit')}</button>
        <button class="action-btn btn-delete" onclick="deleteItem(${item.id})">🗑️ ${t('delete')}</button>
      </div>
    `;
    container.appendChild(card);
  });
}

// ========== FORM ==========
function openForm() {
  editingId = null;
  document.getElementById('f_label_en').value = '';
  document.getElementById('f_label_ur').value = '';
  document.getElementById('f_icon').value = '📌';
  document.getElementById('f_url').value = '';
  document.getElementById('f_order').value = items.length + 1;
  document.getElementById('f_open_in').value = 'webview';
  document.getElementById('f_active').checked = true;
  document.getElementById('name_hint').classList.remove('show');
  document.getElementById('f_label_ur').classList.remove('auto-filled');
  document.getElementById('modalTitle').textContent = t('modalAdd');
  document.getElementById('modal').classList.add('open');
}

function editItem(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  editingId = id;
  document.getElementById('f_label_en').value = item.label_en || '';
  document.getElementById('f_label_ur').value = item.label_ur || '';
  document.getElementById('f_icon').value = item.icon || '📌';
  document.getElementById('f_url').value = item.url || '';
  document.getElementById('f_order').value = item.sort_order || 0;
  document.getElementById('f_open_in').value = item.open_in || 'webview';
  document.getElementById('f_active').checked = !!item.is_active;
  document.getElementById('name_hint').classList.remove('show');
  document.getElementById('modalTitle').textContent = t('modalEdit');
  document.getElementById('modal').classList.add('open');
}

function closeForm() {
  document.getElementById('modal').classList.remove('open');
  editingId = null;
}

function setEmoji(emoji) {
  document.getElementById('f_icon').value = emoji;
}

// ========== SAVE ==========
async function saveItem() {
  const payload = {
    label_ur: document.getElementById('f_label_ur').value.trim(),
    label_en: document.getElementById('f_label_en').value.trim(),
    icon: document.getElementById('f_icon').value.trim() || '📌',
    url: document.getElementById('f_url').value.trim(),
    sort_order: parseInt(document.getElementById('f_order').value) || 0,
    open_in: document.getElementById('f_open_in').value,
    is_active: document.getElementById('f_active').checked,
  };
  if (editingId) payload.id = editingId;

  if (!payload.url) {
    showToast(t('urlRequired'), 'error');
    return;
  }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = '⏳...';

  try {
    const res = await fetch(API_BASE + '/api/save-menu-item', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Save failed');
    showToast(t('saved'), 'success');
    closeForm();
    await loadItems();
  } catch (e) {
    showToast(t('saveFail') + ': ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = t('save');
  }
}

async function deleteItem(id) {
  if (!confirm(t('confirmDelete'))) return;
  try {
    const res = await fetch(API_BASE + '/api/delete-menu-item', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Delete failed');
    showToast(t('deleted'), 'success');
    await loadItems();
  } catch (e) {
    showToast(t('deleteFail') + ': ' + e.message, 'error');
  }
}

// ========== TOAST ==========
function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show ' + (type || '');
  setTimeout(() => { toast.className = 'toast'; }, 2500);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

window.onload = () => {
  setLang(localStorage.getItem('menu_admin_lang') || 'ur');
  loadItems();
};
