<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .urdu {
    font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif !important;
    direction: rtl;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f5f0;
    color: #1a1a1a;
    padding: 14px;
    font-size: 14px;
  }

  .header {
    background: #1b5e20;
    color: white;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .header h1 { font-size: 17px; font-weight: 700; line-height: 2; }
  .lang-toggle { display: flex; gap: 6px; }
  .lang-btn {
    padding: 5px 14px;
    border: 2px solid white;
    background: transparent;
    color: white;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
  }
  .lang-btn.active { background: white; color: #1b5e20; }

  .top-nav {
    text-align: center;
    margin-bottom: 12px;
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .top-nav a {
    color: #1b5e20;
    text-decoration: none;
    font-weight: bold;
    padding: 6px 14px;
    border: 2px solid #1b5e20;
    border-radius: 7px;
    background: white;
    font-size: 12px;
  }

  .add-btn {
    background: #1b5e20;
    color: white;
    border: none;
    padding: 11px;
    border-radius: 9px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    margin-bottom: 12px;
    line-height: 2;
  }

  .menu-card {
    background: white;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.07);
    border-left: 4px solid #1b5e20;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .menu-card.inactive { opacity: 0.55; border-left-color: #999; }

  .menu-icon {
    font-size: 30px;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f9f5;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .menu-info {
    flex: 1;
    min-width: 0;
    text-align: right;
  }

  .menu-label-ur {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 19px;
    font-weight: 700;
    color: #1b5e20;
    direction: rtl;
    line-height: 2;
  }

  .menu-label-en {
    font-size: 12px;
    font-weight: 600;
    color: #666;
    margin-top: 2px;
  }

  .menu-url {
    font-size: 10px;
    color: #999;
    margin-top: 2px;
    word-break: break-all;
  }

  /* Badges — chhote, side by side, overlap nahi */
  .menu-badges {
    display: flex;
    gap: 4px;
    margin-top: 6px;
    justify-content: flex-end;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-block;
    font-family: 'Noto Nastaliq Urdu', serif !important;
    direction: rtl;
    font-size: 11px;
    line-height: 1.4;
    padding: 3px 8px;
    border-radius: 10px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge-active { background: #e8f5e9; color: #1b5e20; }
  .badge-inactive { background: #ffebee; color: #c62828; }
  .badge-type { background: #e3f2fd; color: #0d47a1; }

  .menu-actions {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex-shrink: 0;
  }
  .action-btn {
    padding: 6px 10px;
    border-radius: 7px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
    font-family: 'Noto Nastaliq Urdu', serif !important;
    direction: rtl;
    line-height: 1.6;
    white-space: nowrap;
  }
  .btn-edit { background: #ff9800; color: white; }
  .btn-delete { background: #f44336; color: white; }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 14px;
    z-index: 100;
    overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: white;
    border-radius: 12px;
    padding: 16px;
    max-width: 480px;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
  }
  .modal h2 {
    font-size: 17px;
    color: #1b5e20;
    margin-bottom: 12px;
    text-align: center;
    font-family: 'Noto Nastaliq Urdu', serif !important;
    direction: rtl;
    line-height: 2;
  }

  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #1b5e20;
    margin-bottom: 4px;
    text-align: right;
    font-family: 'Noto Nastaliq Urdu', serif !important;
    direction: rtl;
    line-height: 1.9;
  }
  .field input[type="text"],
  .field input[type="number"],
  .field select {
    width: 100%;
    padding: 8px 10px;
    border: 2px solid #e0e0e0;
    border-radius: 7px;
    font-size: 13px;
    background: white;
  }
  .field input.urdu-input {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 17px;
    line-height: 2.2;
    text-align: right;
    direction: rtl;
    padding: 6px 10px;
  }
  .field input.urdu-input.auto-filled {
    background: #f1f8e9;
    border-color: #66bb6a;
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: #1b5e20;
  }

  .auto-hint {
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 12px;
    line-height: 1.8;
    direction: rtl;
    text-align: right;
    margin-top: 3px;
    padding: 3px 8px;
    border-radius: 5px;
    display: none;
  }
  .auto-hint.show { display: block; }
  .auto-hint.loading { background: #fff3e0; color: #e65100; }
  .auto-hint.success { background: #e8f5e9; color: #2e7d32; }
  .auto-hint.error { background: #ffebee; color: #c62828; }

  .field-row { display: flex; gap: 8px; }
  .field-row > * { flex: 1; }

  .emoji-row {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .emoji-btn {
    font-size: 18px;
    padding: 4px 8px;
    background: #f5f5f5;
    border: 2px solid #e0e0e0;
    border-radius: 7px;
    cursor: pointer;
  }
  .emoji-btn:hover { background: #e8f5e9; border-color: #1b5e20; }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    background: #f9f9f9;
    border-radius: 7px;
  }
  .checkbox-row input[type="checkbox"] { width: 18px; height: 18px; }
  .checkbox-row label {
    margin: 0;
    cursor: pointer;
    font-family: 'Noto Nastaliq Urdu', serif !important;
    direction: rtl;
    font-size: 14px;
    line-height: 1.8;
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .modal-btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 7px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    font-family: 'Noto Nastaliq Urdu', serif !important;
    direction: rtl;
    line-height: 1.8;
  }
  .btn-cancel { background: #e0e0e0; color: #333; }
  .btn-save { background: #1b5e20; color: white; }
  .btn-save:disabled { background: #999; }

  .empty-state {
    text-align: center;
    padding: 30px;
    color: #888;
    background: white;
    border-radius: 10px;
    font-family: 'Noto Nastaliq Urdu', serif !important;
    font-size: 15px;
    direction: rtl;
    line-height: 2;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #323232;
    color: white;
    padding: 10px 20px;
    border-radius: 7px;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 200;
    font-family: 'Noto Nastaliq Urdu', serif !important;
    direction: rtl;
    font-size: 14px;
    line-height: 1.9;
  }
  .toast.show { opacity: 1; }
  .toast.success { background: #1b5e20; }
  .toast.error { background: #c62828; }
</style>
</head>
<body>

<div class="header">
  <h1 id="pageTitle" class="urdu">🎛️ مینو مینیجر</h1>
  <div class="lang-toggle">
    <button class="lang-btn urdu active" id="btn-ur" onclick="setLang('ur')">اردو</button>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
  </div>
</div>

<div style="position:sticky; top:0; z-index:50; background:#f0f5f0; padding:8px 0; margin-bottom:12px; border-bottom:2px solid #e0e0e0;">
  <a href="/admin.html" style="display:inline-block; padding:10px 20px; background:#1b5e20; color:white; text-decoration:none; border-radius:8px; font-weight:bold; font-size:14px;">← Admin Panel</a>
  <a href="/messages.html" style="display:inline-block; padding:10px 20px; background:#e65100; color:white; text-decoration:none; border-radius:8px; font-weight:bold; font-size:14px; margin-left:8px;">📿 Namaz Messages</a>
</div>

<button class="add-btn urdu" id="addBtn" onclick="openForm()">➕ نیا مینو آئٹم شامل کریں</button>

<div id="items-container"></div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeForm()">
  <div class="modal">
    <h2 id="modalTitle">نیا مینو آئٹم</h2>

    <div class="field">
      <label id="lbl_en">انگریزی / رومن اردو — یہاں لکھیں</label>
      <input type="text" id="f_label_en" placeholder="Sawal-Jawab" oninput="onEnglishInput()">
      <div class="auto-hint" id="name_hint"></div>
    </div>

    <div class="field">
      <label id="lbl_ur">اردو نام (خودکار)</label>
      <input type="text" id="f_label_ur" class="urdu-input" placeholder="سوال و جواب" oninput="onUrduManual()">
    </div>

    <div class="field">
      <label id="lbl_icon">آئیکن</label>
      <input type="text" id="f_icon" placeholder="📖" maxlength="4" style="font-size:20px; text-align:center;">
      <div class="emoji-row">
        <button class="emoji-btn" onclick="setEmoji('📖')">📖</button>
        <button class="emoji-btn" onclick="setEmoji('📚')">📚</button>
        <button class="emoji-btn" onclick="setEmoji('❓')">❓</button>
        <button class="emoji-btn" onclick="setEmoji('🎥')">🎥</button>
        <button class="emoji-btn" onclick="setEmoji('💬')">💬</button>
        <button class="emoji-btn" onclick="setEmoji('🕌')">🕌</button>
        <button class="emoji-btn" onclick="setEmoji('📞')">📞</button>
        <button class="emoji-btn" onclick="setEmoji('🔗')">🔗</button>
        <button class="emoji-btn" onclick="setEmoji('📌')">📌</button>
        <button class="emoji-btn" onclick="setEmoji('🌐')">🌐</button>
       <button type="button" class="emoji-btn" onclick="addCustomEmoji()" style="background:#1b5e20; color:white; font-weight:bold; padding:6px 14px;">➕ Custom</button>
        <button class="emoji-btn" onclick="setEmoji('🕋')">🕋</button>
<button class="emoji-btn" onclick="setEmoji('⏰')">⏰</button>
<button class="emoji-btn" onclick="setEmoji('🔔')">🔔</button>
<button class="emoji-btn" onclick="setEmoji('📢')">📢</button>
<button class="emoji-btn" onclick="setEmoji('📸')">📸</button>
<button class="emoji-btn" onclick="setEmoji('📄')">📄</button>
<button class="emoji-btn" onclick="setEmoji('🎧')">🎧</button>
<button class="emoji-btn" onclick="setEmoji('⭐')">⭐</button>
<button class="emoji-btn" onclick="setEmoji('❤️')">❤️</button>
<button class="emoji-btn" onclick="setEmoji('🌙')">🌙</button>
<button class="emoji-btn" onclick="setEmoji('☪️')">☪️</button>
<button class="emoji-btn" onclick="setEmoji('🎯')">🎯</button>
<button class="emoji-btn" onclick="setEmoji('🎨')">🎨</button>
<button class="emoji-btn" onclick="setEmoji('🎬')">🎬</button>
<button class="emoji-btn" onclick="setEmoji('📱')">📱</button>
<button class="emoji-btn" onclick="setEmoji('💻')">💻</button>
      </div>
    </div>

    <div class="field">
      <label id="lbl_url">لنک</label>
      <input type="text" id="f_url" placeholder="/quran">
    </div>

    <div class="field-row">
      <div class="field">
        <label id="lbl_order">ترتیب</label>
        <input type="number" id="f_order" value="0" min="0">
      </div>
      <div class="field">
        <label id="lbl_open_in">کہاں کھلے</label>
        <select id="f_open_in">
          <option value="webview">ایپ میں</option>
          <option value="external">باہر</option>
        </select>
      </div>
    </div>

    <div class="field">
      <div class="checkbox-row">
        <input type="checkbox" id="f_active" checked>
        <label for="f_active" id="lbl_active">فعال</label>
      </div>
    </div>

    <div class="modal-actions">
      <button class="modal-btn btn-cancel" onclick="closeForm()" id="cancelBtn">منسوخ کریں</button>
      <button class="modal-btn btn-save" onclick="saveItem()" id="saveBtn">💾 محفوظ کریں</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = 'https://zahidiya-mysore.pages.dev';
let items = [];
let editingId = null;
let currentLang = 'ur';
let autoTransTimer = null;

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('menu_admin_lang', lang);
  document.getElementById('btn-ur').classList.toggle('active', lang === 'ur');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  updateLabels();
  renderItems();
}

function updateLabels() {
  const ur = currentLang === 'ur';
  const m = {
    en: {
      title: '🎛️ Menu Manager', addBtn: '➕ Add New Menu Item',
      modalAdd: 'Add Menu Item', modalEdit: 'Edit Menu Item',
      lblUr: 'Urdu Label (auto)', lblEn: 'English / Roman Urdu (type here)',
      lblIcon: 'Icon', lblUrl: 'URL', lblOrder: 'Order', lblOpenIn: 'Open In',
      lblActive: 'Active',
      optIn: 'In App', optExt: 'External',
      cancel: 'Cancel', save: '💾 Save', edit: 'Edit', del: 'Delete',
      confirmDel: 'Delete this item?',
      active: 'Active', inactive: 'Off', inApp: 'In App', ext: 'External',
      empty: 'No menu items yet.',
      saved: '✅ Saved', deleted: '✅ Deleted', fail: '❌ Failed',
      urlReq: '⚠️ URL required',
      typing: '✍️ Typing...', translating: '⏳ Translating...',
      translated: '✅ Auto-translated', transFail: '⚠️ Could not translate',
      netErr: '❌ Network error',
    },
    ur: {
      title: '🎛️ مینو مینیجر', addBtn: '➕ نیا مینو آئٹم شامل کریں',
      modalAdd: 'نیا مینو آئٹم', modalEdit: 'مینو میں تبدیلی',
      lblUr: 'اردو نام (خودکار)', lblEn: 'انگریزی / رومن اردو — یہاں لکھیں',
      lblIcon: 'آئیکن', lblUrl: 'لنک', lblOrder: 'ترتیب', lblOpenIn: 'کہاں کھلے',
      lblActive: 'فعال',
      optIn: 'ایپ میں', optExt: 'باہر',
      cancel: 'منسوخ', save: '💾 محفوظ', edit: 'تبدیلی', del: 'حذف',
      confirmDel: 'یہ آئٹم حذف کریں؟',
      active: 'فعال', inactive: 'بند', inApp: 'ایپ میں', ext: 'باہر',
      empty: 'کوئی مینو آئٹم نہیں۔',
      saved: '✅ محفوظ', deleted: '✅ حذف', fail: '❌ ناکام',
      urlReq: '⚠️ لنک ضروری ہے',
      typing: '✍️ ٹائپ کر رہے ہیں...', translating: '⏳ اردو میں ہو رہا ہے...',
      translated: '✅ خودکار اردو ہو گیا', transFail: '⚠️ اردو نہیں ہو سکا',
      netErr: '❌ نیٹ ورک مسئلہ',
    }
  };
  window.T = m[ur ? 'ur' : 'en'];

  document.getElementById('pageTitle').textContent = T.title;
  document.getElementById('addBtn').textContent = T.addBtn;
  document.getElementById('lbl_ur').textContent = T.lblUr;
  document.getElementById('lbl_en').textContent = T.lblEn;
  document.getElementById('lbl_icon').textContent = T.lblIcon;
  document.getElementById('lbl_url').textContent = T.lblUrl;
  document.getElementById('lbl_order').textContent = T.lblOrder;
  document.getElementById('lbl_open_in').textContent = T.lblOpenIn;
  document.getElementById('lbl_active').textContent = T.lblActive;
  document.getElementById('f_open_in').options[0].text = T.optIn;
  document.getElementById('f_open_in').options[1].text = T.optExt;
  document.getElementById('cancelBtn').textContent = T.cancel;
  document.getElementById('saveBtn').textContent = T.save;
  document.getElementById('modalTitle').textContent = editingId ? T.modalEdit : T.modalAdd;
}

function onEnglishInput() {
  const enVal = document.getElementById('f_label_en').value.trim();
  const hint = document.getElementById('name_hint');
  if (autoTransTimer) clearTimeout(autoTransTimer);
  if (!enVal) { hint.classList.remove('show'); return; }
  hint.textContent = T.typing;
  hint.className = 'auto-hint show loading';
  autoTransTimer = setTimeout(() => autoTransliterate(enVal), 1500);
}

async function autoTransliterate(text) {
  const urInput = document.getElementById('f_label_ur');
  const hint = document.getElementById('name_hint');
  hint.textContent = T.translating;
  hint.className = 'auto-hint show loading';
  try {
    const url = `${API_BASE}/api/transliterate?text=${encodeURIComponent(text)}`;
    const res = await fetch(url);
    const proxyData = await res.json();
    if (!proxyData.success) throw new Error('Proxy fail');
    const data = proxyData.data;
    if (data && data[0] === 'SUCCESS' && data[1] && data[1][0] && data[1][0][1] && data[1][0][1].length > 0) {
      urInput.value = data[1][0][1][0];
      urInput.classList.add('auto-filled');
      hint.textContent = T.translated;
      hint.className = 'auto-hint show success';
      setTimeout(() => hint.classList.remove('show'), 2500);
    } else {
      hint.textContent = T.transFail;
      hint.className = 'auto-hint show error';
    }
  } catch (e) {
    hint.textContent = T.netErr;
    hint.className = 'auto-hint show error';
  }
}

function onUrduManual() {
  document.getElementById('f_label_ur').classList.remove('auto-filled');
}

async function loadItems() {
  try {
    const res = await fetch(API_BASE + '/api/get-menu-items');
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    items = data.items || [];
    renderItems();
  } catch (e) {
    document.getElementById('items-container').innerHTML =
      '<div class="empty-state">❌ ' + e.message + '</div>';
  }
}

function renderItems() {
  const container = document.getElementById('items-container');
  if (!items.length) {
    container.innerHTML = '<div class="empty-state">' + T.empty + '</div>';
    return;
  }
  container.innerHTML = '';
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'menu-card' + (item.is_active ? '' : ' inactive');
    const typeBadge = item.open_in === 'external' ? T.ext : T.inApp;
    const activeBadge = item.is_active ? T.active : T.inactive;
    card.innerHTML = `
      <div class="menu-icon">${item.icon || '📌'}</div>
      <div class="menu-info">
        <div class="menu-label-ur">${escapeHtml(item.label_ur || '—')}</div>
        <div class="menu-label-en">${escapeHtml(item.label_en || '')}</div>
        <div class="menu-url">🔗 ${escapeHtml(item.url || '')}</div>
        <div class="menu-badges">
          <span class="badge ${item.is_active ? 'badge-active' : 'badge-inactive'}">${activeBadge}</span>
          <span class="badge badge-type">${typeBadge}</span>
        </div>
      </div>
      <div class="menu-actions">
        <button class="action-btn btn-edit" onclick="editItem(${item.id})">✏️ ${T.edit}</button>
        <button class="action-btn btn-delete" onclick="deleteItem(${item.id})">🗑️ ${T.del}</button>
      </div>
    `;
    container.appendChild(card);
  });
}

function openForm() {
  editingId = null;
  document.getElementById('f_label_en').value = '';
  document.getElementById('f_label_ur').value = '';
  document.getElementById('f_icon').value = '📌';
  document.getElementById('f_url').value = '';
  document.getElementById('f_order').value = items.length + 1;
  document.getElementById('f_open_in').value = 'webview';
  document.getElementById('f_active').checked = true;
  document.getElementById('name_hint').classList.remove('show');
  document.getElementById('f_label_ur').classList.remove('auto-filled');
  document.getElementById('modalTitle').textContent = T.modalAdd;
  document.getElementById('modal').classList.add('open');
}

function editItem(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  editingId = id;
  document.getElementById('f_label_en').value = item.label_en || '';
  document.getElementById('f_label_ur').value = item.label_ur || '';
  document.getElementById('f_icon').value = item.icon || '📌';
  document.getElementById('f_url').value = item.url || '';
  document.getElementById('f_order').value = item.sort_order || 0;
  document.getElementById('f_open_in').value = item.open_in || 'webview';
  document.getElementById('f_active').checked = !!item.is_active;
  document.getElementById('name_hint').classList.remove('show');
  document.getElementById('modalTitle').textContent = T.modalEdit;
  document.getElementById('modal').classList.add('open');
}

function closeForm() {
  document.getElementById('modal').classList.remove('open');
  editingId = null;
}

function setEmoji(emoji) {
  document.getElementById('f_icon').value = emoji;
}

async function saveItem() {
  const payload = {
    label_ur: document.getElementById('f_label_ur').value.trim(),
    label_en: document.getElementById('f_label_en').value.trim(),
    icon: document.getElementById('f_icon').value.trim() || '📌',
    url: document.getElementById('f_url').value.trim(),
    sort_order: parseInt(document.getElementById('f_order').value) || 0,
    open_in: document.getElementById('f_open_in').value,
    is_active: document.getElementById('f_active').checked,
  };
  if (editingId) payload.id = editingId;
  if (!payload.url) { showToast(T.urlReq, 'error'); return; }
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  try {
    const res = await fetch(API_BASE + '/api/save-menu-item', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    showToast(T.saved, 'success');
    closeForm();
    await loadItems();
  } catch (e) {
    showToast(T.fail + ': ' + e.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

async function deleteItem(id) {
  if (!confirm(T.confirmDel)) return;
  try {
    const res = await fetch(API_BASE + '/api/delete-menu-item', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    showToast(T.deleted, 'success');
    await loadItems();
  } catch (e) {
    showToast(T.fail + ': ' + e.message, 'error');
  }
}

function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show ' + (type || '');
  setTimeout(() => { toast.className = 'toast'; }, 2500);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

window.onload = () => {
  setLang(localStorage.getItem('menu_admin_lang') || 'ur');
  loadItems();
};
</script>

</body>
